<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">EHOBA scrubbed dashboard preview</title>
  <desc id="desc">A sanitized preview of the EHOBA processing dashboard with all hotel names, CUEs, and figures anonymized.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1400" height="788" fill="url(#bg)"/>
  <rect x="48" y="44" width="1304" height="700" rx="24" fill="#0d1424" stroke="#26364d" filter="url(#shadow)"/>
  <rect x="48" y="44" width="230" height="700" rx="24" fill="#0a1020"/>
  <rect x="48" y="44" width="230" height="700" rx="24" fill="none" stroke="#26364d"/>
  <text x="82" y="96" fill="#dbe7ff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">EHOBA</text>
  <text x="82" y="122" fill="#7f8ea8" font-family="JetBrains Mono, Consolas, monospace" font-size="13">PROCESSOR</text>
  <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#aebbd0">
    <rect x="76" y="176" width="174" height="42" rx="10" fill="#15233b"/>
    <text x="102" y="203" fill="#e9f1ff">Control panel</text>
    <text x="102" y="258">Input</text>
    <text x="102" y="313">Hotels</text>
    <text x="102" y="368">Corrections</text>
    <text x="102" y="423">Output</text>
    <text x="102" y="478">History</text>
  </g>
  <g transform="translate(320 86)">
    <text x="0" y="0" fill="#f2f6ff" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">Monthly run control</text>
    <text x="0" y="34" fill="#93a4bd" font-family="Inter, Arial, sans-serif" font-size="17">Scrubbed portfolio preview. Names, CUEs, and survey values are masked.</text>
    <g transform="translate(0 78)">
      <rect width="296" height="132" rx="18" fill="url(#panel)" stroke="#26364d"/>
      <text x="24" y="42" fill="#8fc7ff" font-family="JetBrains Mono, Consolas, monospace" font-size="13">ESTABLISHMENTS</text>
      <text x="24" y="92" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700">53</text>
    </g>
    <g transform="translate(324 78)">
      <rect width="296" height="132" rx="18" fill="url(#panel)" stroke="#26364d"/>
      <text x="24" y="42" fill="#8fc7ff" font-family="JetBrains Mono, Consolas, monospace" font-size="13">RUN STATUS</text>
      <text x="24" y="92" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Validated</text>
    </g>
    <g transform="translate(648 78)">
      <rect width="296" height="132" rx="18" fill="url(#panel)" stroke="#26364d"/>
      <text x="24" y="42" fill="#8fc7ff" font-family="JetBrains Mono, Consolas, monospace" font-size="13">CORRECTION ORDER</text>
      <text x="24" y="92" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700">8 steps</text>
    </g>
    <g transform="translate(0 244)">
      <rect width="944" height="346" rx="20" fill="#0d1424" stroke="#26364d"/>
      <text x="26" y="42" fill="#f2f6ff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Correction review queue</text>
      <text x="26" y="72" fill="#93a4bd" font-family="Inter, Arial, sans-serif" font-size="15">Representative UI with all operational data masked.</text>
      <g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#7f8ea8">
        <text x="26" y="120">HOTEL</text>
        <text x="306" y="120">CUE</text>
        <text x="510" y="120">CHECK</text>
        <text x="720" y="120">ACTION</text>
      </g>
      <g font-family="Inter, Arial, sans-serif" font-size="16">
        <rect x="22" y="140" width="900" height="52" rx="12" fill="#121c30"/>
        <text x="44" y="173" fill="#e9f1ff">Hotel 01</text>
        <text x="306" y="173" fill="#93a4bd" font-family="JetBrains Mono, Consolas, monospace">XX-000000-X</text>
        <text x="510" y="173" fill="#f6c66b">Tariff average</text>
        <text x="720" y="173" fill="#8ee0b0">Apply step 2</text>
        <rect x="22" y="204" width="900" height="52" rx="12" fill="#121c30"/>
        <text x="44" y="237" fill="#e9f1ff">Hotel 02</text>
        <text x="306" y="237" fill="#93a4bd" font-family="JetBrains Mono, Consolas, monospace">XX-000000-X</text>
        <text x="510" y="237" fill="#f6c66b">Traveler subtotals</text>
        <text x="720" y="237" fill="#8ee0b0">Apply step 5</text>
        <rect x="22" y="268" width="900" height="52" rx="12" fill="#121c30"/>
        <text x="44" y="301" fill="#e9f1ff">Hotel 03</text>
        <text x="306" y="301" fill="#93a4bd" font-family="JetBrains Mono, Consolas, monospace">XX-000000-X</text>
        <text x="510" y="301" fill="#f6c66b">Occupancy rates</text>
        <text x="720" y="301" fill="#8ee0b0">Apply step 6</text>
      </g>
    </g>
  </g>
</svg>
