<style>
:root{
  --pink:#ff2d95; --violet:#7b2ff7; --cyan:#00e5ff;
  --yellow:#fff200; --lime:#baff29; --ink:#0d0d0d;
  --head:"Baloo 2","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;
  --body:"Poppins","Segoe UI",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--body); color:var(--ink); min-height:100vh; padding:26px 14px 30px;
  background:
    radial-gradient(rgba(0,0,0,.13) 1.4px, transparent 1.5px) 0 0/17px 17px,
    linear-gradient(135deg,#ff2d95 0%,#c02be0 32%,#7b2ff7 58%,#00e5ff 100%);
  background-attachment:fixed;
}
.wrap{max-width:880px;margin:0 auto}
.hero{
  background:var(--ink); border:5px solid #000; border-radius:24px;
  box-shadow:12px 12px 0 var(--cyan); padding:22px 24px; margin-bottom:22px;
  transform:rotate(-.7deg);
}
.hero h1{
  font-family:var(--head); font-weight:800; color:#fff; margin:0;
  font-size:clamp(1.7rem,5.4vw,2.9rem); line-height:1.05; letter-spacing:.5px;
  text-shadow:3px 3px 0 var(--pink), 6px 6px 0 var(--violet);
}
.hero p{font-family:var(--head);color:var(--lime);margin:.5rem 0 0;font-size:1rem;font-weight:600}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:34px}
.nav a{
  font-family:var(--head);font-weight:800;color:#000;text-decoration:none;background:var(--yellow);
  border:3px solid #000;border-radius:999px;padding:5px 18px;box-shadow:4px 4px 0 #000;
}
.nav a:active{transform:translate(4px,4px);box-shadow:0 0 0 #000}
.card{
  background:#fff; border:4px solid #000; border-radius:20px; padding:22px 22px 24px;
  margin-bottom:34px; position:relative; scroll-margin-top:14px;
}
.card:nth-of-type(3n+1){box-shadow:10px 10px 0 var(--pink);  transform:rotate(-.45deg)}
.card:nth-of-type(3n+2){box-shadow:10px 10px 0 var(--violet);transform:rotate(.4deg)}
.card:nth-of-type(3n+3){box-shadow:10px 10px 0 var(--cyan);  transform:rotate(-.3deg)}
.tag{
  display:inline-block; font-family:var(--head); font-weight:800; font-size:.82rem;
  background:var(--yellow); border:3px solid #000; border-radius:999px;
  padding:3px 14px; margin-bottom:10px; text-transform:uppercase; letter-spacing:1px;
}
.card h2{font-family:var(--head);font-weight:800;font-size:1.55rem;margin:.1rem 0 .3rem;line-height:1.15}
.sub{font-size:.9rem;color:#4a4a4a;margin:0 0 18px}
.btn{
  font-family:var(--head); font-weight:800; font-size:1rem; color:#fff; cursor:pointer;
  background:linear-gradient(90deg,var(--pink),var(--violet));
  border:3px solid #000; border-radius:999px; padding:10px 26px;
  box-shadow:5px 5px 0 #000; transition:transform .07s, box-shadow .07s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translate(5px,5px);box-shadow:0 0 0 #000}
.btn.ghost{background:#fff;color:#000}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:20px}
.scoreline{font-family:var(--head);font-weight:800;font-size:1.05rem}
.item{border:3px solid #000;border-radius:16px;padding:15px 16px;margin-bottom:18px;background:#fff}
.item .q{font-size:1.04rem;font-weight:500;margin:0 0 11px;line-height:1.6}
.item .q .n{
  font-family:var(--head);font-size:.8rem;font-weight:800;color:#fff;background:var(--violet);
  border:2px solid #000;border-radius:50%;width:24px;height:24px;margin-right:8px;
  display:inline-flex;align-items:center;justify-content:center;
}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  font-family:var(--body);font-size:.97rem;font-weight:500;cursor:pointer;background:#fff;text-align:left;
  border:3px solid #000;border-radius:14px;padding:9px 16px;line-height:1.4;box-shadow:3px 3px 0 #000;
  transition:transform .07s,box-shadow .07s;
}
.opt b{font-family:var(--head);font-weight:800;margin-right:8px}
.opt:hover{background:#fff9c9}
.opt.sel{background:var(--cyan);transform:translate(3px,3px);box-shadow:0 0 0 #000}
.opt.good{background:var(--lime);border-color:#1c7a00}
.opt.bad{background:#ffc2d8;text-decoration:line-through;border-color:#c2004c}
.opt[disabled]{cursor:default}
select{
  font-family:var(--body);font-size:.95rem;font-weight:500;padding:7px 10px;max-width:100%;
  border:3px solid #000;border-radius:11px;background:#fffdf2;outline:none;
}
select:focus{box-shadow:0 0 0 4px var(--cyan)}
select.ok{background:#e4ffc4;border-color:#1c7a00}
select.no{background:#ffe0ec;border-color:#c2004c}
.selrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.selrow label{font-family:var(--head);font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.8px}
input.gapin{
  font-family:var(--body);font-size:1rem;font-weight:600;width:170px;max-width:100%;padding:3px 8px;margin:0 4px;
  border:0;border-bottom:3px solid #000;background:#fffdf2;outline:none;border-radius:6px 6px 0 0;
}
input.gapin:focus{background:#e9fbff;border-bottom-color:var(--violet)}
input.gapin.ok{background:#e4ffc4;border-bottom-color:#1c7a00}
input.gapin.no{background:#ffe0ec;border-bottom-color:#c2004c}
.box{border:3px dashed #000;border-radius:14px;padding:12px 14px;margin:0 0 18px;background:#f4efff}
.box .bt{font-family:var(--head);font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.9px;margin-bottom:6px}
.ends{list-style:none;margin:0;padding:0}
.ends li{margin:0 0 6px;line-height:1.45;font-size:.97rem}
.ends b{font-family:var(--head);font-weight:800;margin-right:6px}
.audiobox{background:var(--ink);border:3px solid #000;border-radius:14px;padding:10px 12px;margin:0 0 16px}
.audiobox .al{font-family:var(--head);font-weight:800;color:var(--lime);font-size:.85rem;text-transform:uppercase;letter-spacing:1px;margin:0 0 6px}
.audiobox audio{width:100%;display:block}
.seg{
  font-family:var(--head);font-weight:800;font-size:.85rem;cursor:pointer;background:var(--yellow);color:#000;
  border:3px solid #000;border-radius:999px;padding:3px 14px;box-shadow:3px 3px 0 #000;margin:0 0 10px;
}
.seg:active{transform:translate(3px,3px);box-shadow:0 0 0 #000}
.exp{border:3px solid #000;border-radius:14px;padding:12px 14px;margin-top:12px;background:#f4efff;font-size:.93rem;line-height:1.5}
.exp.right{background:#f0ffe0}
.exp.wrong{background:#fff0f5}
.exp b.lab{
  font-family:var(--head);font-size:.76rem;text-transform:uppercase;letter-spacing:.9px;
  display:inline-block;border:2px solid #000;border-radius:999px;padding:0 9px;margin-right:7px;
}
.lab.why{background:var(--cyan)}
.lab.tip{background:var(--yellow)}
.lab.ev{background:var(--lime)}
.exp p{margin:0 0 7px}
.exp p:last-child{margin-bottom:0}
.sol{font-family:var(--head);font-weight:800;color:#12006b}
.note{font-family:var(--head);font-weight:800;color:#c2004c;margin:10px 0 0}
.divider{font-family:var(--head);font-weight:800;font-size:1.15rem;margin:26px 0 12px;padding-top:14px;border-top:3px dashed #000}
footer{
  max-width:880px;margin:0 auto;padding:16px 10px 8px;text-align:center;
  font-family:var(--head);font-weight:700;color:#fff;font-size:.95rem;
  text-shadow:2px 2px 0 rgba(0,0,0,.55);
}
</style>

   - p3: matching de 5 speakers, dos tareas (t1 profesiones, t2 afirmaciones). seg = [inicio, fin] en segundos.
   - p4: 10 extractos cortos de un solo audio, opcion multiple. seg por extracto.

    { seg: [255.8, 301.3], q: "Why have the family’s plans about the grandparents changed?",
      o: ["The retirement complex is too expensive.", "The father thinks the house is too small.", "The grandparents want a house of their own."], a: 1,
      ev: "Dad isn't really happy with the idea as he's worried about space.",
      why: "The father is worried about space because there is hardly enough room for the family now.",
      tip: "Ask who has the problem. The grandparents liked the retirement complex, but the reason for the change is Dad’s worry." },
    { seg: [301.3, 349.0], q: "What does Katrina say young people get from activity holidays?",
      o: ["Better exam results.", "More confidence in themselves.", "A wish to go climbing every year."], a: 1,
      ev: "it's a great way to meet new people and get more self-belief",
      why: "“Self-belief” means confidence in yourself. Katrina says that young people arrive anxious and finish with new friends.",
      tip: "Listen for synonyms: self-belief = confidence. Climbing is the most popular activity, but that is not a benefit." },
    { seg: [349.0, 397.2], q: "What did the girl like best about her holiday?",
      o: ["Eating food from the farm.", "Looking at the tourist spots.", "Giving food to the animals."], a: 2,
      ev: "By far the best thing was being able to give the farmers cows and sheep their food.",
      why: "“By far the best thing” shows her favourite part. The farm food and the tourist information were only nice extras.",
      tip: "Superlative signals like “by far the best” or “my favourite” introduce the answer." },
    { seg: [397.2, 441.7], q: "What does the girl suggest Johnny should do?",
      o: ["Ask his mum to buy the tickets.", "Wait until he is old enough to go alone.", "Go with Harry and one of Harry’s parents."], a: 2,
      ev: "Could you go with a friend and one of their parents? ... You could ask Harry if they could go with you.",
      why: "Johnny’s mum says he is not old enough to go alone. The girl suggests asking Harry if they could go together with a parent.",
      tip: "A suggestion often starts with “You could ...”. Listen to what comes after it." },
    { seg: [441.7, 483.2], q: "Why does one of the friends want to buy Rita another present?",
      o: ["Rita already has what was given to her.", "The first present was broken.", "The friend forgot to wrap the first present."], a: 0,
      ev: "I should have known she would have all the Hunger Games books.",
      why: "The first present was something Rita does not need, because she already has all the Hunger Games books.",
      tip: "Regret phrases like “I should have known” explain the mistake: she already owns it." }
  ]
},

p5: {
  audio: "audio/u5-megan.mp3",
  items: [
    { q: "What does Megan say about people who study sports science?",
      o: ["They are all dedicated athletes.", "They need a special sports skill.", "They do not have to be top sportspeople."], a: 2,
      ev: "it must be for dedicated sports people ... But that's not the case at all.",
      why: "People think the course is only for athletes, but Megan says this is not true. She says that she herself is “no athlete”.",
      tip: "“People think ... but that’s not the case” means the opposite is true. Options A and B repeat what people wrongly believe." },
    { q: "What interests Megan most about sport?",
      o: ["The psychology behind it.", "The chance to meet famous players.", "The way athletes train their bodies."], a: 0,
      ev: "What really fascinates me about sports is the psychology behind it all.",
      why: "“Fascinates me” shows what interests her most: how people feel when they compete.",
      tip: "Strong verbs like “fascinates” or “really love” introduce the answer." },
    { q: "What does Megan say makes a championship-winning sportsperson?",
      o: ["Great skill alone.", "The right personality and attitude.", "A good coach and plenty of training."], a: 1,
      ev: "Without the right personality, the right attitude, individuals with great skill are unlikely to ever become championship-winning sports people.",
      why: "Megan says that skill is not enough: without the right personality and attitude, skilled people rarely become champions.",

    { q: "What is Megan looking forward to in the third year of the course?",

      ev: "in year three, students have what's called an international year. That gives us the chance to go overseas to study sport",
      why: "In year three there is an international year. Students can go overseas to study sport, and Megan cannot wait.",
      tip: "Option A mixes two ideas: the USA is a possible country, but the course has continuous assessment, not a final exam." },
    { q: "Which part of the course does Megan like best?",
      o: ["Psychology.", "Anatomy.", "Nutrition."], a: 0,
      ev: "in addition, we do a lot of psychology, and that's my absolute favourite",

      tip: "When a speaker lists several things, the favourite usually comes after “but” or “in addition”." },
    { q: "What does Megan say about the graduates of the course?",
      o: ["Most become professional athletes.", "Most work in the sports industry in some way.", "Many cannot find a job."], a: 1,

      why: "“The majority” means most people. They are not all athletes: they work as coaches, trainers, researchers or managers.",
      tip: "“The majority” = most. “We won’t all be involved directly with athletes” shows why option A is wrong." },
    { q: "How does Megan feel about becoming a sports psychologist?",
      o: ["She is sure, in spite of the hard work and low pay.", "She is worried about the hard work.", "She might change her mind because of the low pay."], a: 0,
      ev: "I also know it doesn't pay well. But I'm 100% sure that's what I want to do.",
      why: "She knows that the job is hard and does not pay well, but she is 100% sure. “In spite of” has the same idea as “but”.",
      tip: "The word “but” changes the direction of the sentence. Her doubts come first, her decision comes after." },
    { q: "What would Megan’s job as a sports psychologist be?",
      o: ["To help athletes win more money.", "To help athletes train harder.", "To help athletes get their confidence back."], a: 2,
      ev: "I'd help them to rebuild their positive mental attitude and sharpen their focus.",
      why: "Athletes sometimes lose their confidence and motivation. Megan would help them to rebuild their positive attitude.",
      tip: "“Rebuild” means to make something strong again. Confidence = “positive mental attitude” here." },
    { q: "What does Megan say about the amount of reading on the course?",
      o: ["There is less than students expect.", "There is more than people think.", "It is the hardest part of the course."], a: 1,
      ev: "there's a lot more reading than you might think",
      why: "“A lot more ... than you might think” means there is more reading than people expect.",
      tip: "Compare the comparative words: “more than you think” = more than people expect. Option A says the opposite." },
    { q: "What is Megan’s main advice to future students?",
      o: ["Practise as many sports as possible.", "Read more than other students.", "Do not expect too much from your own sports ability."], a: 2,

      why: "“Set their sights too high” means to expect too much. Megan’s top tip is not to do this, because it leads to disappointment.",

<script id="engine-block">
(function () {
  var LETTERS = ["A", "B", "C", "D", "E", "F", "G", "H"];
  var MCREG = [], GAPREG = [], MATREG = [];

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function expl(ok, solHtml, evidence, why, tip) {
    var h = '<div class="exp ' + (ok ? "right" : "wrong") + '">';
    h += '<p>' + (ok ? "Correct! " : "Not quite. ") + solHtml + '</p>';
    if (evidence) h += '<p><b class="lab ev">Evidence</b>&ldquo;' + esc(evidence) + '&rdquo;</p>';
    h += '<p><b class="lab why">Why</b>' + esc(why) + '</p>';
    h += '<p><b class="lab tip">Exam tip</b>' + esc(tip) + '</p></div>';
    return h;
  }
  function scoreText(ok, total) {
    var msg = ok === total ? "Perfect!" : (ok >= total - 2 ? "Well done!" : "Keep going, read the tips and listen again.");
    return "Score: " + ok + " / " + total + " - " + msg;
  }
  function shell(tag, title, sub, prefix) {
    return '<div class="tag">' + esc(tag) + '</div><h2>' + esc(title) + '</h2><p class="sub">' + esc(sub) + '</p>' +
      '<div id="' + prefix + 'Body"></div>' +
      '<div class="btnrow"><button class="btn" id="' + prefix + 'Check">Check answers</button>' +
      '<button class="btn ghost" id="' + prefix + 'Reset">Try again</button>' +
      '<span class="scoreline" id="' + prefix + 'Score"></span></div>';
  }
  function audioBox(id, src, label) {
    return '<div class="audiobox"><p class="al">' + esc(label) + '</p><audio id="' + id + '" controls preload="metadata" src="' + esc(src) + '"></audio></div>';
  }
  function segBtn(audId, seg, label) {
    return '<button type="button" class="seg" data-aud="' + audId + '" data-s="' + seg[0] + '" data-e="' + seg[1] + '">&#9654; ' + esc(label) + '</button>';
  }

  /* ----- play one part of a long audio file ----- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest(".seg");
    if (!b) return;
    var a = document.getElementById(b.getAttribute("data-aud"));
    if (!a) return;
    if (!a._hooked) {
      a._hooked = true;
      a.addEventListener("timeupdate", function () {
        if (a._stop && a.currentTime >= a._stop) { a.pause(); a._stop = null; }
      });
      a.addEventListener("seeking", function () { if (!a._own) a._stop = null; });
      a.addEventListener("seeked", function () { a._own = false; });
    }
    a._own = true;
    a._stop = +b.getAttribute("data-e");
    a.currentTime = +b.getAttribute("data-s");
    var p = a.play();
    if (p && p.catch) p.catch(function () {});
  });

  function norm(s) {
    return String(s).toLowerCase().replace(/[‘’]/g, "'").replace(/[.,;:!?"]/g, " ").replace(/\s+/g, " ").trim();
  }

  /* ================= gap fill ================= */
  function buildGaps(card, P, tag, title, sub, prefix, audId) {
    card.innerHTML = shell(tag, title, sub, prefix);
    var body = card.querySelector("#" + prefix + "Body");
    var score = card.querySelector("#" + prefix + "Score");
    var ids = [];
    function render() {
      body.innerHTML = ""; score.textContent = ""; ids = [];
      var top = document.createElement("div");
      top.innerHTML = audioBox(audId, P.audio, "Part audio");
      body.appendChild(top);
      P.items.forEach(function (it, i) {
        var id = GAPREG.length;
        GAPREG.push({ item: it });
        ids.push(id);
        var div = document.createElement("div");
        div.className = "item";
        div.innerHTML = '<p class="q"><span class="n">' + (i + 1) + '</span>' + esc(it.pre) +
          ' <input class="gapin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-gid="' + id + '" aria-label="answer ' + (i + 1) + '"> ' +
          esc(it.post) + '</p><div class="fb" data-gid="' + id + '"></div>';
        body.appendChild(div);
      });
    }
    card.querySelector("#" + prefix + "Check").addEventListener("click", function () {
      var ok = 0;
      ids.forEach(function (id) {
        var it = GAPREG[id].item;
        var inp = body.querySelector('input[data-gid="' + id + '"]');
        var val = norm(inp.value).replace(/^(the|a|an) /, "");
        var good = val !== "" && it.ok.some(function (k) { return norm(k).replace(/^(the|a|an) /, "") === val; });
        inp.className = "gapin " + (good ? "ok" : "no"); inp.readOnly = true;
        if (good) ok++;
        var sol = 'Answer: <span class="sol">' + esc(it.ok[0]) + '</span>';
        body.querySelector('.fb[data-gid="' + id + '"]').innerHTML = expl(good, sol, it.ev, it.why, it.tip);
      });
      score.textContent = scoreText(ok, ids.length);
    });
    card.querySelector("#" + prefix + "Reset").addEventListener("click", render);
    render();
  }

  /* ================= multiple choice (also with per-item extract buttons) ================= */
  function buildMC(card, P, tag, title, sub, prefix, audId, segLabel) {
    card.innerHTML = shell(tag, title, sub, prefix);
    var body = card.querySelector("#" + prefix + "Body");
    var score = card.querySelector("#" + prefix + "Score");
    var ids = [];
    function render() {
      body.innerHTML = ""; score.textContent = ""; ids = [];
      var top = document.createElement("div");
      top.innerHTML = audioBox(audId, P.audio, segLabel ? "Full recording" : "Part audio");
      body.appendChild(top);
      P.items.forEach(function (it, i) {
        var id = MCREG.length;
        MCREG.push({ item: it, sel: null });
        ids.push(id);
        var div = document.createElement("div");
        div.className = "item";
        var optsH = it.o.map(function (o, k) {
          return '<button class="opt" data-mcid="' + id + '" data-k="' + k + '"><b>' + LETTERS[k] + '</b>' + esc(o) + '</button>';
        }).join("");
        div.innerHTML = '<p class="q"><span class="n">' + (i + 1) + '</span>' + esc(it.q) + '</p>' +
          (it.seg ? segBtn(audId, it.seg, segLabel + " " + (i + 1)) : "") +
          '<div class="opts">' + optsH + '</div><div class="fb" data-mcid="' + id + '"></div>';
        body.appendChild(div);
      });
    }
    body.addEventListener("click", function (e) {
      var b = e.target.closest(".opt");
      if (!b || b.disabled) return;
      MCREG[+b.getAttribute("data-mcid")].sel = +b.getAttribute("data-k");
      Array.prototype.forEach.call(b.parentNode.children, function (x) { x.classList.remove("sel"); });
      b.classList.add("sel");
    });
    card.querySelector("#" + prefix + "Check").addEventListener("click", function () {
      var ok = 0;
      ids.forEach(function (id) {
        var rec = MCREG[id], it = rec.item;
        var good = rec.sel === it.a;
        if (good) ok++;
        Array.prototype.forEach.call(body.querySelectorAll('.opt[data-mcid="' + id + '"]'), function (b) {
          var k = +b.getAttribute("data-k");
          b.disabled = true; b.classList.remove("sel");
          if (k === it.a) b.classList.add("good");
          else if (rec.sel === k) b.classList.add("bad");
        });
        var sol = 'Answer: <span class="sol">' + LETTERS[it.a] + '</span> - ' + esc(it.o[it.a]);
        body.querySelector('.fb[data-mcid="' + id + '"]').innerHTML = expl(good, sol, it.ev, it.why, it.tip);
      });
      score.textContent = scoreText(ok, ids.length);
    });
    card.querySelector("#" + prefix + "Reset").addEventListener("click", render);
    render();
  }

  /* ================= matching: two tasks on one recording ================= */
  function buildMatching(card, P, prefix, audId) {
    card.innerHTML = shell("Part 3 · Unit 3", "Work experience",
      "You will hear five students talking about the work experience they did. Do Task A and then Task B. Use each letter only once in each task. There are three extra options in each list. You can play each speaker on its own.", prefix);
    var body = card.querySelector("#" + prefix + "Body");
    var score = card.querySelector("#" + prefix + "Score");
    var rows = [];
    function task(T, title, instr, key) {
      var d = document.createElement("div");
      var listH = T.options.map(function (o, i) { return "<li><b>" + LETTERS[i] + ".</b>" + esc(o) + "</li>"; }).join("");
      d.innerHTML = '<p class="divider">' + esc(title) + '</p><div class="box"><div class="bt">' + esc(instr) + '</div><ul class="ends">' + listH + '</ul></div>';
      body.appendChild(d);
      T.items.forEach(function (it, i) {
        var id = MATREG.length;
        MATREG.push({ item: it, T: T, key: key });
        rows.push(id);
        var div = document.createElement("div");
        div.className = "item";
        div.innerHTML = '<p class="q"><span class="n">' + (i + 1) + '</span><b>Speaker ' + (i + 1) + '</b></p>' +
          segBtn(audId, P.speakers[i], "Play speaker " + (i + 1)) +
          '<div class="selrow"><label>Letter</label><select data-mid="' + id + '"><option value="">?</option>' +
          T.options.map(function (o, k) { return '<option value="' + k + '">' + LETTERS[k] + '</option>'; }).join("") +
          '</select></div><div class="fb" data-mid="' + id + '"></div>';
        body.appendChild(div);
      });
      var note = document.createElement("p");
      note.className = "note"; note.setAttribute("data-note", key);
      body.appendChild(note);
    }
    function render() {
      body.innerHTML = ""; score.textContent = ""; rows = [];
      var top = document.createElement("div");
      top.innerHTML = audioBox(audId, P.audio, "Full recording (all five speakers)");
      body.appendChild(top);
      task(P.t1, "Task A · What job is each speaker talking about?", "Choose the job (A-H)", "t1");
      task(P.t2, "Task B · What does each speaker say about the work experience?", "Choose what each speaker says (A-H)", "t2");
    }
    card.querySelector("#" + prefix + "Check").addEventListener("click", function () {
      var ok = 0, used = { t1: {}, t2: {} }, dup = { t1: false, t2: false };
      rows.forEach(function (id) {
        var rec = MATREG[id], s = body.querySelector('select[data-mid="' + id + '"]');
        if (s.value !== "") { if (used[rec.key][s.value]) dup[rec.key] = true; used[rec.key][s.value] = 1; }
      });
      rows.forEach(function (id) {
        var rec = MATREG[id], it = rec.item;
        var s = body.querySelector('select[data-mid="' + id + '"]');
        var good = s.value !== "" && +s.value === it.ans;
        s.className = good ? "ok" : "no"; s.disabled = true;
        if (good) ok++;
        var sol = 'Answer: <span class="sol">' + LETTERS[it.ans] + '</span> - ' + esc(rec.T.options[it.ans]);
        body.querySelector('.fb[data-mid="' + id + '"]').innerHTML = expl(good, sol, it.ev, it.why, it.tip);
      });
      ["t1", "t2"].forEach(function (k) {
        body.querySelector('[data-note="' + k + '"]').textContent = dup[k] ? "Remember: use each letter only once in this task." : "";
      });
      score.textContent = scoreText(ok, rows.length);
    });
    card.querySelector("#" + prefix + "Reset").addEventListener("click", render);
    render();
  }

  /* ---------- page ---------- */
  var app = document.getElementById("app");
  var nav = document.getElementById("nav");
  function add(id, label) {
    var a = document.createElement("a");
    a.href = "#" + id; a.textContent = label; nav.appendChild(a);
    var c = document.createElement("section");
    c.className = "card"; c.id = id; app.appendChild(c);
    return c;
  }

  buildGaps(add("p1", "Part 1"), DATA.p1, "Part 1 · Unit 1", "Living with colour blindness",
    "You will hear a boy called Andy talking about his experience of being colour blind. Complete the sentences, 1-10, with a word or a short phrase.", "p1", "aud1");
  buildMC(add("p2", "Part 2"), DATA.p2, "Part 2 · Unit 2", "Hosting overseas visitors",
    "You will hear an interview with Sarah Reeve, who helps with overseas visitors to her town. For questions 1-10, choose the best answer (A, B or C).", "p2", "aud2", null);
  buildMatching(add("p3", "Part 3"), DATA.p3, "p3", "aud3");
  buildMC(add("p4", "Part 4"), DATA.p4, "Part 4 · Unit 4", "Ten short extracts",
    "You will hear people talking in ten different situations. For questions 1-10, choose the best answer (A, B or C). Use the yellow button to play each extract on its own.", "p4", "aud4", "Play extract");
  buildMC(add("p5", "Part 5"), DATA.p5, "Part 5 · Unit 5", "Studying sports science",
    "You will hear an interview with Megan Corbett, who is studying sports science at university. For questions 1-10, choose the best answer (A, B or C).", "p5", "aud5", null);
})();
</script>
