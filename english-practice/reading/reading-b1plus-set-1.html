<style>
:root{
  --pink:#ff2d95; --violet:#7b2ff7; --cyan:#00e5ff;
  --yellow:#fff200; --lime:#baff29; --ink:#0d0d0d;
  --head:"Baloo 2","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;
  --body:"Poppins","Segoe UI",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--body); color:var(--ink); min-height:100vh; padding:26px 14px 30px;
  background:
    radial-gradient(rgba(0,0,0,.13) 1.4px, transparent 1.5px) 0 0/17px 17px,
    linear-gradient(135deg,#ff2d95 0%,#c02be0 32%,#7b2ff7 58%,#00e5ff 100%);
  background-attachment:fixed;
}
.wrap{max-width:880px;margin:0 auto}

.hero{
  background:var(--ink); border:5px solid #000; border-radius:24px;
  box-shadow:12px 12px 0 var(--cyan); padding:22px 24px; margin-bottom:22px;
  transform:rotate(-.7deg);
}
.hero h1{
  font-family:var(--head); font-weight:800; color:#fff; margin:0;
  font-size:clamp(1.7rem,5.4vw,2.9rem); line-height:1.05; letter-spacing:.5px;
  text-shadow:3px 3px 0 var(--pink), 6px 6px 0 var(--violet);
}
.hero p{font-family:var(--head);color:var(--lime);margin:.5rem 0 0;font-size:1rem;font-weight:600}

.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:34px}
.nav a{
  font-family:var(--head);font-weight:800;color:#000;text-decoration:none;background:var(--yellow);
  border:3px solid #000;border-radius:999px;padding:5px 18px;box-shadow:4px 4px 0 #000;
}
.nav a:active{transform:translate(4px,4px);box-shadow:0 0 0 #000}

.card{
  background:#fff; border:4px solid #000; border-radius:20px; padding:22px 22px 24px;
  margin-bottom:34px; position:relative; scroll-margin-top:14px;
}
.card:nth-of-type(3n+1){box-shadow:10px 10px 0 var(--pink);  transform:rotate(-.45deg)}
.card:nth-of-type(3n+2){box-shadow:10px 10px 0 var(--violet);transform:rotate(.4deg)}
.card:nth-of-type(3n+3){box-shadow:10px 10px 0 var(--cyan);  transform:rotate(-.3deg)}

.tag{
  display:inline-block; font-family:var(--head); font-weight:800; font-size:.82rem;
  background:var(--yellow); border:3px solid #000; border-radius:999px;
  padding:3px 14px; margin-bottom:10px; text-transform:uppercase; letter-spacing:1px;
}
.card h2{font-family:var(--head);font-weight:800;font-size:1.55rem;margin:.1rem 0 .3rem;line-height:1.15}
.sub{font-size:.9rem;color:#4a4a4a;margin:0 0 18px}

.read p{font-size:1.04rem;line-height:1.7;margin:0 0 14px}
.read p:last-child{margin-bottom:0}
.hl{background:var(--yellow);border-radius:4px;padding:0 3px;font-weight:600}

.btn{
  font-family:var(--head); font-weight:800; font-size:1rem; color:#fff; cursor:pointer;
  background:linear-gradient(90deg,var(--pink),var(--violet));
  border:3px solid #000; border-radius:999px; padding:10px 26px;
  box-shadow:5px 5px 0 #000; transition:transform .07s, box-shadow .07s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translate(5px,5px);box-shadow:0 0 0 #000}
.btn.ghost{background:#fff;color:#000}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:20px}
.scoreline{font-family:var(--head);font-weight:800;font-size:1.05rem}

.item{border:3px solid #000;border-radius:16px;padding:15px 16px;margin-bottom:18px;background:#fff}
.item .q{font-size:1.04rem;font-weight:500;margin:0 0 11px;line-height:1.5}
.item .q .n{
  font-family:var(--head);font-size:.8rem;font-weight:800;color:#fff;background:var(--violet);
  border:2px solid #000;border-radius:50%;width:24px;height:24px;margin-right:8px;
  display:inline-flex;align-items:center;justify-content:center;
}
.opts{display:flex;flex-wrap:wrap;gap:9px}
.opt{
  font-family:var(--body);font-size:.97rem;font-weight:500;cursor:pointer;background:#fff;
  border:3px solid #000;border-radius:999px;padding:7px 22px;box-shadow:3px 3px 0 #000;
  transition:transform .07s,box-shadow .07s;
}
.opt:hover{background:#fff9c9}
.opt.sel{background:var(--cyan);transform:translate(3px,3px);box-shadow:0 0 0 #000}
.opt.good{background:var(--lime);border-color:#1c7a00}
.opt.bad{background:#ffc2d8;text-decoration:line-through;border-color:#c2004c}
.opt[disabled]{cursor:default}

select{
  font-family:var(--body);font-size:.95rem;font-weight:500;padding:7px 10px;max-width:100%;
  border:3px solid #000;border-radius:11px;background:#fffdf2;outline:none;
}
select:focus{box-shadow:0 0 0 4px var(--cyan)}
select.ok{background:#e4ffc4;border-color:#1c7a00}
select.no{background:#ffe0ec;border-color:#c2004c}
.selrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.selrow label{font-family:var(--head);font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.8px}

.box{
  border:3px dashed #000;border-radius:14px;padding:12px 14px;margin:0 0 18px;background:#f4efff;
}
.box .bt{font-family:var(--head);font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.9px;margin-bottom:6px}
.words{display:flex;flex-wrap:wrap;gap:8px}
.words span{
  font-family:var(--head);font-weight:700;background:var(--cyan);border:2px solid #000;
  border-radius:999px;padding:1px 12px;
}
.ends{list-style:none;margin:0;padding:0}
.ends li{margin:0 0 6px;line-height:1.45;font-size:.97rem}
.ends b{font-family:var(--head);font-weight:800;margin-right:6px}
.blank{display:inline-block;min-width:56px;border-bottom:3px solid #000;margin:0 3px}

.exp{
  border:3px solid #000;border-radius:14px;padding:12px 14px;margin-top:12px;
  background:#f4efff;font-size:.93rem;line-height:1.5;
}
.exp.right{background:#f0ffe0}
.exp.wrong{background:#fff0f5}
.exp b.lab{
  font-family:var(--head);font-size:.76rem;text-transform:uppercase;letter-spacing:.9px;
  display:inline-block;border:2px solid #000;border-radius:999px;padding:0 9px;margin-right:7px;
}
.lab.why{background:var(--cyan)}
.lab.tip{background:var(--yellow)}
.lab.ev{background:var(--lime)}
.exp p{margin:0 0 7px}
.exp p:last-child{margin-bottom:0}
.sol{font-family:var(--head);font-weight:800;color:#12006b}
.mark{font-family:var(--head);font-weight:800;font-size:.8rem;border:2px solid #000;border-radius:999px;padding:1px 10px;margin-left:8px}
.mark.y{background:var(--lime)}
.mark.n{background:#ff9dc4}

footer{
  max-width:880px;margin:0 auto;padding:16px 10px 8px;text-align:center;
  font-family:var(--head);font-weight:700;color:#fff;font-size:.95rem;
  text-shadow:2px 2px 0 rgba(0,0,0,.55);
}
</style>

<body>
<div class="wrap">

  <div class="hero">
    <h1>READING &middot; B1+</h1>
    <p>Read the text &bull; True or false &bull; Complete the sentences &bull; Match the meanings</p>
  </div>

  <div class="nav" id="nav"></div>

  <div id="app"></div>

</div>

<script id="data-block">
/* ====== Reading comprehension, Gold Experience B1+ (units 4, 5, 7 y 8).
   Tres textos de dificultad creciente. Cada uno trae:
   - tf: verdadero/falso con evidencia del texto (ev), why y tip.
   - comp: "match and complete". Se elige el final (A-F) Y la palabra de la caja.
           end = indice del final correcto, word = indice de la palabra en box.
           En los finales, "___" marca el hueco de la palabra.
   - vocab: expresion resaltada con ** en el texto -> definicion (def = indice).
   Las partes comp se reordenaron respecto del .md original: alli la caja de
   palabras no coincidia con los huecos y habia ambiguedad. ====== */
var DATA = {

texts: [

/* ---------------------------------------------------------------- TEXT 1 */
{
  id: "t1", nav: "Text 1", level: "Medium", title: "Alternative Learning and Financial Independence",
  paras: [
    "When sixteen-year-old Sophia transferred to Oakridge Academy, a non-traditional secondary school where students are encouraged to design their own learning path, she was extremely **anxious about** making the right decision. At her previous school, students had to follow rigid timetables, and Sophia often felt overwhelmed by competitive exam pressure. However, at Oakridge, teachers firmly believe that young people should be allowed to choose subjects that they are passionate about and capable of mastering.",
    "The school, which was founded five years ago by an innovative headteacher, offers a unique curriculum that combines traditional academic subjects with essential life skills. In her favorite class, personal finance, Sophia learns how to manage money, understand local currency, and calculate monthly budgets. Before taking this course, she used to waste her pocket money on impulse purchases and frequently ran out of cash. Now, she knows how to distinguish between essential daily expenses and unnecessary luxury items. “If students learn how to manage their allowance early, they will avoid getting into serious debt when they grow up,” explains her teacher, Mr. Davies, whose creative teaching methods have received widespread praise throughout the region.",
    "Last month, Sophia’s class participated in a special enterprise project where they had to set up small school businesses. Sophia’s team decided to produce eco-friendly study planners made from recycled materials. At first, calculating production costs seemed tricky, but working together made the entire process a **piece of cake**. Sophia, who is exceptionally creative and sensible, was responsible for the marketing campaign. She had to **look up** information online about sustainable paper suppliers and write down detailed price estimates for her teammates.",
    "Whenever team members **fell behind** with their individual assignments, Sophia helped them **catch up** so that nobody felt left out. “We ought to have spent more time reviewing our initial budget,” Sophia admits, “because we almost ran out of funds midway through. But in the end, our planners were sold out within hours and were awarded first prize at the annual school fair!”",
    "Through this rewarding experience, Sophia learned invaluable lessons about teamwork and financial independence. She realized that if she had not taken the risk of changing schools, she would never have discovered her passion for entrepreneurship. Now, she feels far more confident about her academic future and believes that every school should offer practical courses where teenagers can learn how to **cope with** real-world challenges."
  ],
  tf: [
    { q: "Sophia changed schools because her old school offered too few traditional academic subjects.", a: false,
      ev: "“students had to follow rigid timetables, and Sophia often felt overwhelmed by competitive exam pressure.”",
      why: "The problem at her old school was not the subjects. It was the strict timetables and the pressure from exams.",
      tip: "Look for the reason in the text, not in your own ideas. The text gives two reasons, and “too few subjects” is not one of them." },
    { q: "At Oakridge Academy, students are not allowed to choose their own subjects.", a: false,
      ev: "“teachers firmly believe that young people should be allowed to choose subjects that they are passionate about.”",
      why: "The text says the opposite: students are allowed to choose, and the school encourages them to design their own path.",
      tip: "“Not allowed” is the opposite of “should be allowed”. When a statement turns the idea around, the answer is usually False." },
    { q: "Before the personal finance class, Sophia used her pocket money in a sensible way.", a: false,
      ev: "“she used to waste her pocket money on impulse purchases and frequently ran out of cash.”",
      why: "“Used to waste” describes a bad habit in the past. She wasted her money and often had none left.",
      tip: "“Used to + verb” talks about the past, and the words “Before taking this course” tell you it is about the time before the class." },
    { q: "Sophia’s team made study planners from recycled materials.", a: true,
      ev: "“Sophia’s team decided to produce eco-friendly study planners made from recycled materials.”",
      why: "“Make” and “produce” mean the same thing here, so the statement says the same as the text with different words.",
      tip: "Statements often use a synonym. Do not look for the exact same word; look for the same idea." },
    { q: "Sophia thinks her team should have spent more time checking their first budget.", a: true,
      ev: "“We ought to have spent more time reviewing our initial budget,” Sophia admits.",
      why: "“Ought to have + past participle” shows regret about something that did not happen. “Reviewing” and “checking” mean the same.",
      tip: "“Ought to have” and “should have” both mean “it was a good idea, but we did not do it”." },
    { q: "Sophia believes she would have found her interest in business if she had stayed at her old school.", a: false,
      ev: "“if she had not taken the risk of changing schools, she would never have discovered her passion for entrepreneurship.”",
      why: "The text says that without the change she would never have found her passion. The statement says the opposite.",
      tip: "Third conditional: “if + had not + past participle, would never have + past participle”. It describes what did NOT happen, so read it backwards." }
  ],
  box: ["look up", "piece of cake", "manage", "ought to", "catch up", "sensible"],
  endings: [
    "___ information about sustainable paper suppliers.",
    "___ have spent more time checking the budget.",
    "___ their money and avoid debt.",
    "___ with their work.",
    "a ___ for everyone.",
    "___ enough to make good choices about money."
  ],
  comp: [
    { begin: "At Oakridge Academy, students learn how to", end: 2, word: 2, d: ["managed", "managing"],
      why: "After “learn how to” we need the base form of a verb. “Manage” fits, and money and debt go together with it.",
      tip: "Look at the words just before the gap. “How to” is always followed by the base form (manage, not managed)." },
    { begin: "Calculating the budget looked tricky, but working as a team made it", end: 4, word: 1, d: ["piece of pie", "slice of cake"],
      why: "“Tricky” is the problem and “but” brings the opposite idea: the task was very easy in the end. A “piece of cake” is something easy.",
      tip: "“But” signals a contrast. If the first part says “difficult”, the second part says “easy”." },
    { begin: "Sophia was chosen to lead the marketing because she was creative and", end: 5, word: 5, d: ["sensitive", "sensibly"],
      why: "“Creative and ___” needs another adjective for a person. “Sensible” means practical and able to make good decisions.",
      tip: "After “and”, use the same type of word as before it: adjective + and + adjective." },
    { begin: "For the project, Sophia had to go online to", end: 0, word: 0, d: ["look after", "look out"],
      why: "“Go online to look up information” means to search for facts on the internet.",
      tip: "Go online / use the internet + information: the phrasal verb is “look up”." },
    { begin: "When her teammates fell behind, Sophia helped them", end: 3, word: 4, d: ["catch on", "put up"],
      why: "If people are behind, they need to reach the others again. “Catch up with their work” means to reach the same level.",
      tip: "“Fall behind” and “catch up” are opposites. They often appear in the same sentence." },
    { begin: "Sophia says her team", end: 1, word: 3, d: ["ought", "ought to be"],
      why: "The ending has “have spent”, and Sophia talks about a mistake in the past. “Ought to have + past participle” shows regret.",
      tip: "See “have + past participle” after a gap? Think of ought to / should / could + have." }
  ],
  vocab: [
    { term: "Anxious about", para: 1, def: 1,
      why: "Sophia was “extremely anxious” about her decision: she was worried because it was an important choice.",
      tip: "“Anxious about” is followed by a worry: anxious about exams, about the future." },
    { term: "Piece of cake", para: 3, def: 3,
      why: "The text says calculating costs was tricky at first, but then it became very easy.",
      tip: "Idioms are not literal. There is no real cake here, so use the context to find the meaning." },
    { term: "Look up", para: 3, def: 0,
      why: "Sophia goes online and finds facts about suppliers. That is searching for information.",
      tip: "“Look up” + information, a word or a number = search for it in a book or online." },
    { term: "Fall behind", para: 4, def: 5,
      why: "Team members “fell behind with their assignments”, so they were slower than they should be.",
      tip: "“Behind” is the clue: the opposite of being ahead or on time." },
    { term: "Catch up", para: 4, def: 2,
      why: "Sophia helped the slower students so that they could be at the same level as the group again.",
      tip: "“Catch up” is the opposite of “fall behind”. Learn them as a pair." },
    { term: "Cope with", para: 5, def: 4,
      why: "Teenagers learn practical skills to handle real-world “challenges”, which means to deal with difficult situations.",
      tip: "“Cope with” is usually followed by something hard: cope with stress, with problems, with change." }
  ],
  defs: [
    "Search for specific information in a book, database, or online.",
    "Feel worried, uneasy, or nervous about something.",
    "Reach the same level or speed as others after being behind.",
    "Something that is very easy to do or achieve.",
    "Successfully deal with or handle a difficult situation.",
    "Make slower progress than other people or fail to meet a deadline."
  ]
},

/* ---------------------------------------------------------------- TEXT 2 */
{
  id: "t2", nav: "Text 2", level: "Hard", title: "The Eco-Tech High School Project",
  paras: [
    "Across the globe, progressive high schools are increasingly recognizing that environmental education cannot be taught merely through standard classroom textbooks. At Greenfield High, an ambitious group of senior students, led by seventeen-year-old Marcus, recently embarked on an extraordinary environmental project: transforming a **derelict** storage building into a futuristic, solar-powered eco-lab.",
    "When the initiative was first proposed to the school council, several teachers were noticeably hesitant, believing that teenagers might be too indecisive or irresponsible to manage such a complex enterprise. However, Marcus and his classmates, who were deeply **passionate about** environmental sustainability, quickly proved the doubters wrong. They worked tirelessly every afternoon, refusing to fall behind with their regular academic studies while **going over** technical diagrams and architectural plans for the new facility.",
    "The project demanded a sophisticated combination of scientific understanding and practical hands-on skills. First, the old damaged roof had to be completely replaced. The students **had high-efficiency solar panels installed** by local professional engineers, ensuring that the new structure could generate its own clean electricity. Inside, smart environmental sensors—which were generously donated by a local technology company—were fitted to monitor indoor temperature and energy consumption in real time. “If the team had not received professional assistance from experienced technicians, the electrical installation would have been far more dangerous,” Marcus explained during an interview with the student newspaper. “We had the entire wiring system checked three times before turning the power on to prevent any dangerous electrical accidents.”",
    "Financing the eco-lab presented another **formidable hurdle**. The total expenditure was estimated at several thousand dollars, an amount that the school board simply could not afford to pay. Rather than giving up, the student committee organized an energetic community fundraising campaign. They sold handmade crafts, offered computer maintenance services, and applied for environmental research grants. “We wish we had started searching for corporate sponsorship much earlier,” admitted Elena, the team’s financial officer. “If only we had known how long grant applications take to process! We had to deal with endless administrative paperwork and provide detailed information regarding our projected energy savings. Furthermore, we had to ensure that our official accounting records were completely accurate and transparent.”",
    "Despite these challenging obstacles, the eco-lab was officially opened last week during a special ceremony attended by local dignitaries and parents. The building, surrounded by native trees and colorful flowers, now serves as a vibrant educational space where students conduct advanced biology experiments, **calculate carbon footprints**, and study renewable energy solutions. The remarkable success of the project has generated tremendous enthusiasm throughout the entire educational district. Headteachers from neighboring towns have already visited Greenfield High to inspect the impressive facility and learn directly from the students’ unique experience. Unless young people are given genuine opportunities to solve real environmental problems, they will struggle to develop the critical thinking skills required in the modern world. Marcus and his dedicated team have clearly demonstrated that when teenagers are trusted with real responsibility, extraordinary achievements are possible."
  ],
  tf: [
    { q: "The teachers supported Marcus’s idea from the start, without any doubts.", a: false,
      ev: "“several teachers were noticeably hesitant, believing that teenagers might be too indecisive or irresponsible.”",
      why: "“Hesitant” means not sure. The teachers had doubts about the students, so they did not support the idea at once.",
      tip: "Watch out for words like “without any” and “from the start”. If the text shows even a little doubt, the statement is False." },
    { q: "The students did not pay attention to their school subjects while they built the eco-lab.", a: false,
      ev: "“refusing to fall behind with their regular academic studies.”",
      why: "“Refusing to fall behind” means they kept up with their studies. They did not neglect them.",
      tip: "“Refuse to + verb” means “say no to doing it”. Refusing to fall behind = making sure they did NOT fall behind." },
    { q: "The students put in the solar panels by themselves, without adult help.", a: false,
      ev: "“The students had high-efficiency solar panels installed by local professional engineers.”",
      why: "“Had something installed” means somebody else did the job. The engineers installed the panels, not the students.",
      tip: "Look for “have + object + past participle” (had panels installed). It means another person did the work for you." },
    { q: "The school board paid the whole cost of the eco-lab.", a: false,
      ev: "“an amount that the school board simply could not afford to pay.”",
      why: "The board could not pay, so the students had to raise the money with a fundraising campaign.",
      tip: "“Could not afford” = did not have enough money. Then the whole statement about paying is False." },
    { q: "Elena is sorry that the team did not start looking for company sponsors sooner.", a: true,
      ev: "“We wish we had started searching for corporate sponsorship much earlier.”",
      why: "“Wish + had + past participle” shows regret about the past. “Corporate” means related to companies.",
      tip: "“I wish I had …” = I am sorry I did not. A wish about the past is a regret." },
    { q: "Headteachers from nearby towns have not shown any interest in the eco-lab.", a: false,
      ev: "“Headteachers from neighboring towns have already visited Greenfield High to inspect the impressive facility.”",
      why: "“Neighboring” means nearby, and “have already visited” shows real interest.",
      tip: "“Already” in the text tells you that something has happened, so “not any interest” cannot be right." }
  ],
  box: ["going to be", "dependent on", "unless", "going over", "had solar panels installed", "wish they had"],
  endings: [
    "___ started looking for grant money earlier.",
    "___ the technical plans for the building.",
    "___ used for science experiments next year.",
    "___ by professional engineers.",
    "___ they get real chances to solve real problems.",
    "highly ___ the support of adults."
  ],
  comp: [
    { begin: "The students spent their afternoons carefully", end: 1, word: 3, d: ["go over", "gone over"],
      why: "“Spent their afternoons carefully ___” needs an -ing form. “Going over” plans means studying them with attention.",
      tip: "After “spend time”, use a verb with -ing: spend time going over, working on, checking." },
    { begin: "To keep the lab safe, the team", end: 3, word: 4, d: ["installed solar panels", "had installed solar panels"],
      why: "The ending says “by professional engineers”, so the team arranged for experts to do the work. This is the structure “have + object + past participle”.",
      tip: "See “by + person” at the end? The sentence is passive, so look for “had … installed”." },
    { begin: "Elena said that she and her team", end: 0, word: 5, d: ["wish they would have", "wish they have"],
      why: "The ending has “started … earlier”, which is a regret about the past. “Wish they had started” shows that they are sorry.",
      tip: "“Wish + had + past participle” = regret about the past. “Earlier” in the ending is a good clue." },
    { begin: "The success of student projects is often", end: 5, word: 1, d: ["dependent of", "dependent from"],
      why: "“Highly ___ the support of adults” needs an adjective + preposition. “Dependent on” means that something needs something else.",
      tip: "Some adjectives always go with one preposition: dependent on, interested in, afraid of. Learn them together." },
    { begin: "The eco-lab is", end: 2, word: 0, d: ["going to", "going be"],
      why: "The ending has “next year”, so this is a plan for the future. “Is going to be used” is the passive form.",
      tip: "A future time (next year, tomorrow) + a plan = going to. For the passive, add “be” + past participle." },
    { begin: "Young people will not learn to think critically", end: 4, word: 2, d: ["if not", "unless not"],
      why: "“Unless” means “if not”. The idea is: they will not learn if they do not get real chances.",
      tip: "“Unless” already has a negative meaning. Do not use “not” after it (unless they get, not unless they do not get)." }
  ],
  vocab: [
    { term: "Derelict", para: 1, def: 3,
      why: "The students want to change an old building into a new lab, so the building was in a bad state because nobody used it.",
      tip: "When a word is new, look at what the sentence says is going to change. A building that needs “transforming” is probably in bad condition." },
    { term: "Passionate about", para: 2, def: 5,
      why: "Marcus and his classmates worked “tirelessly” on sustainability, so they felt very strongly about it.",
      tip: "Passionate about + a topic. The word “deeply” before it shows a strong feeling." },
    { term: "Go over", para: 2, def: 0,
      why: "They looked at technical diagrams and plans with attention. That means checking them carefully.",
      tip: "“Go over” + documents, plans or notes = read and check them again." },
    { term: "Have something installed", para: 3, def: 4,
      why: "The panels were put in by engineers, so the students arranged for experts to do the job.",
      tip: "Have + object + past participle = another person does it for you (have your hair cut, have a car repaired)." },
    { term: "Formidable hurdle", para: 4, def: 1,
      why: "The total cost was too high for the school board. This was a very big problem that the students had to solve.",
      tip: "A “hurdle” is something you must jump over in a race. In English it also means a problem on the way to a goal." },
    { term: "Calculate carbon footprints", para: 5, def: 2,
      why: "A carbon footprint is the amount of carbon dioxide that people or things produce. Students work it out in numbers.",
      tip: "“Calculate” tells you the answer is a number. Footprint here is a measure, not a real foot mark." }
  ],
  defs: [
    "Examine, review, or study something carefully.",
    "A very difficult problem or obstacle that requires great effort to overcome.",
    "Measure the amount of carbon dioxide produced by human activities.",
    "In a very poor condition as a result of disuse and neglect.",
    "Arrange for an expert or technician to put equipment or machinery into place.",
    "Having or showing compelling enthusiasm or strong feelings for something."
  ]
},

/* ---------------------------------------------------------------- TEXT 3 */
{
  id: "t3", nav: "Text 3", level: "Very hard", title: "Smart Future: Technology, Education, and Youth Enterprise",
  paras: [
    "In recent years, the rapid integration of artificial intelligence into educational platforms has fundamentally transformed how secondary school students review complex academic material. However, few digital innovations have attracted as much national attention as ‘BrainBoost’, a revolutionary learning software application developed entirely by a talented group of teenage programmers from Chicago.",
    "The ambitious enterprise began two years ago when eighteen-year-old Julian and his classmates realized that conventional study methods were failing to **keep up with** the rigorous demands of modern secondary examinations. Many of their peers were falling behind in challenging subjects like advanced mathematics and physics, feeling completely overwhelmed by vast quantities of unfamiliar information. “If traditional revision techniques had been truly effective, so many intelligent students wouldn’t have been struggling,” Julian observed during a technology conference. “We realized that an **adaptive software algorithm**—one that identifies an individual learner’s specific weaknesses and customizes practice exercises accordingly—must be created to support struggling students.”",
    "Developing the application was a tough, exhausting process that tested the young team’s determination to its absolute limits. Because none of the teenagers possessed formal university qualifications in software engineering at the time, they had to spend hundreds of hours studying coding tutorials online, frequently staying up late after completing their regular school homework. Furthermore, financial resources were exceptionally tight. They couldn’t afford commercial developer software, so they were forced to **make do with** basic open-source tools. “Looking back, we **ought to have** sought professional advice from experienced software engineers much earlier,” recalls Maya, the project’s lead graphic designer. “Had we done so, we would certainly have avoided several critical programming errors that set our development timeline back by months. We really should have planned our schedule far more carefully.”",
    "Data security also presented a nightmare scenario for the young entrepreneurs. Midway through the development phase, the team **had their original cloud database server compromised** by anonymous hackers, resulting in the catastrophic loss of several months of valuable source code. They were forced to have their entire system security architecture completely **overhauled** by professional cybersecurity experts before officially launching the product. “It was an immensely stressful period,” Maya admits. “If we hadn’t had our network protocols updated immediately, the entire project would have been permanently destroyed and our young company would have gone bankrupt.”",
    "Fortunately, their extraordinary perseverance eventually paid off. Today, ‘BrainBoost’ is being actively utilized by over fifty secondary schools across the state. The software relies on sophisticated mathematical calculations to analyze precisely how long a student spends on each question, predicting when they are likely to forget key concepts and automatically scheduling targeted review sessions. Teachers who have introduced the application report remarkable improvements in student concentration, academic performance, and overall exam results.",
    "The inspiring success of ‘BrainBoost’ conclusively proves that when young people are provided with proper resources and encouragement, their creative potential is virtually limitless. Educational authorities are currently evaluating whether similar student-led technological initiatives should be officially funded on a national scale. Unless modern educational systems adapt quickly to embrace youth-led technological innovation, they risk leaving future generations unprepared for an increasingly competitive digital economy. For Julian and Maya, who are now preparing to enter university, the journey has been an unforgettable experience that has permanently shaped their professional ambitions and opened doors to exciting new career opportunities."
  ],
  tf: [
    { q: "‘BrainBoost’ was designed by professional university professors in Chicago.", a: false,
      ev: "“developed entirely by a talented group of teenage programmers from Chicago.”",
      why: "The designers were teenagers, not professors. The word “entirely” shows that nobody else helped with the development.",
      tip: "The place (Chicago) is correct, but the people are wrong. Check every detail in a statement, not only the first one." },
    { q: "Julian believed that traditional study methods were good enough for modern exams.", a: false,
      ev: "“conventional study methods were failing to keep up with the rigorous demands of modern secondary examinations.”",
      why: "“Failing to keep up” means the old methods were not good enough. Julian thought the students needed something new.",
      tip: "“Conventional” and “traditional” are synonyms. Then “failing” tells you the opinion is negative." },
    { q: "The team had a lot of money and bought expensive commercial software.", a: false,
      ev: "“financial resources were exceptionally tight. They couldn’t afford commercial developer software.”",
      why: "“Tight” means that there was very little money. They used free tools because they could not pay for the others.",
      tip: "“Couldn’t afford” is a clear signal for lack of money. It is the opposite of “bought”." },
    { q: "Maya wishes the team had asked experienced software engineers for help sooner.", a: true,
      ev: "“we ought to have sought professional advice from experienced software engineers much earlier.”",
      why: "“Ought to have + past participle” shows regret. “Sought” is the past of “seek” and here it means asked for.",
      tip: "Maya says “Looking back”. Thinking about the past + ought to have = regret." },
    { q: "The team fixed the security problem themselves, without hiring outside experts.", a: false,
      ev: "“They were forced to have their entire system security architecture completely overhauled by professional cybersecurity experts.”",
      why: "“Have something overhauled by experts” means experts did the job. The team did not do it themselves.",
      tip: "When you see “by” + a group of professionals, someone else did the work." },
    { q: "‘BrainBoost’ is now used in more than fifty schools in the state.", a: true,
      ev: "“‘BrainBoost’ is being actively utilized by over fifty secondary schools across the state.”",
      why: "“Over fifty” means more than fifty, and “utilized” is a formal word for “used”.",
      tip: "Numbers can be written with different words: over = more than. Learn the pairs." }
  ],
  box: ["make do with", "provided that", "algorithm", "had their server compromised", "revise for", "ought to have"],
  endings: [
    "___ basic open-source tools.",
    "___ by hackers.",
    "___ planned their schedule more carefully.",
    "___ they get proper funding and support.",
    "an intelligent ___ that predicts when students will forget key ideas.",
    "___ difficult school exams."
  ],
  comp: [
    { begin: "The software helps students who need to", end: 5, word: 4, d: ["revise of", "revise about"],
      why: "“Revise for” an exam means to study the material again before the test. After “need to” we use the base form of a verb.",
      tip: "Exam + study again = revise for. Remember: in British English, “revise” means to review your notes." },
    { begin: "The app is powered by", end: 4, word: 2, d: ["algorithms", "algorithmic"],
      why: "A program that follows rules to solve a problem is an algorithm. Here it works out when students forget things.",
      tip: "After “an intelligent” we need a noun, and the ending says it “predicts”. Software + rules = algorithm." },
    { begin: "Commercial software was too expensive, so the teenagers had to", end: 0, word: 0, d: ["make do of", "do make with"],
      why: "They had little money, so they used simple free tools. “Make do with” means to accept something that is not perfect.",
      tip: "“So” introduces a result. Lack of money → use less good things = make do with." },
    { begin: "Maya thinks that the team", end: 2, word: 5, d: ["ought to", "ought have"],
      why: "The ending needs “have planned”, and Maya talks about a mistake in the past. “Ought to have planned” shows regret.",
      tip: "Past participle after the gap (planned) + advice about the past = ought to have." },
    { begin: "The project nearly failed when the team", end: 1, word: 3, d: ["had compromised their server", "compromised their server"],
      why: "“By hackers” tells us the team did not choose it: it happened to them. “Had their server compromised” is the structure for bad events.",
      tip: "“Have + object + past participle” can also describe bad things that happen to you (had my phone stolen)." },
    { begin: "Student tech projects can grow across the country", end: 3, word: 1, d: ["provided", "provide that"],
      why: "“Provided that” means “if, and only if”. Growth is possible on the condition that they get funding and support.",
      tip: "“Provided that” and “as long as” both give a condition. They are followed by a normal sentence." }
  ],
  vocab: [
    { term: "Keep up with", para: 2, def: 1,
      why: "Study methods were too slow for the demands of the exams, so they were not moving at the same speed.",
      tip: "“Keep up with” is about speed or progress: keep up with the class, with the news, with prices." },
    { term: "Adaptive software algorithm", para: 2, def: 2,
      why: "Julian says it finds each learner’s weak points and changes the exercises. That is software that adjusts by itself.",
      tip: "“Adaptive” comes from “adapt”, which means to change to fit something." },
    { term: "Make do with", para: 3, def: 3,
      why: "They could not afford the good tools, so they used the basic ones that they had.",
      tip: "“Make do with” usually comes after a problem: no money, no time, no space." },
    { term: "Ought to have", para: 3, def: 5,
      why: "Maya looks back at the past and says they should have asked for help. It was a good idea, but they did not do it.",
      tip: "“Looking back” in the same sentence is the clue for a regret or a past mistake." },
    { term: "Have a server compromised", para: 4, def: 0,
      why: "Hackers got into the database without permission and the team lost months of code.",
      tip: "In computing, “compromised” means that security was broken and strangers had access." },
    { term: "Overhaul", para: 4, def: 4,
      why: "Experts looked at the whole security system and improved it completely before the launch.",
      tip: "“Overhaul” is a strong word: not a small fix, but a complete check and repair." }
  ],
  defs: [
    "Experience a security breach where unauthorized people access private computer data.",
    "Move, progress, or increase at the same rate as something else.",
    "A self-learning set of computer rules that automatically adjusts to a user’s needs.",
    "Manage or survive using whatever limited resources are available, even if imperfect.",
    "Completely examine, repair, or redesign a system or process.",
    "Express a past obligation or regret about something that was advisable but not done."
  ]
}

]
};
</script>

<script id="engine-block">
(function () {
  var LETTERS = ["A", "B", "C", "D", "E", "F"];
  var TFREG = [], COMPREG = [], VOCREG = [];

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function fmt(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<b class="hl">$1</b>');
  }
  function plain(s) { return String(s).replace(/\*\*/g, ""); }
  function endHtml(s) { return esc(s).replace("___", '<span class="blank"></span>'); }

  function expl(ok, solHtml, evidence, why, tip) {
    var h = '<div class="exp ' + (ok ? "right" : "wrong") + '">';
    h += '<p>' + (ok ? "Correct! " : "Not quite. ") + solHtml + '</p>';
    if (evidence) h += '<p><b class="lab ev">Evidence</b>' + esc(evidence) + '</p>';
    h += '<p><b class="lab why">Why</b>' + esc(why) + '</p>';
    h += '<p><b class="lab tip">Exam tip</b>' + esc(tip) + '</p></div>';
    return h;
  }

  function scoreText(ok, total) {
    var msg = ok === total ? "Perfect!" : (ok >= total - 2 ? "Well done!" : "Keep going, read the tips and try again.");
    return "Score: " + ok + " / " + total + " - " + msg;
  }

  function sectionShell(tag, title, sub, bodyId, prefix) {
    return '<div class="tag">' + esc(tag) + '</div><h2>' + esc(title) + '</h2><p class="sub">' + esc(sub) + '</p>' +
      '<div id="' + prefix + 'Body"></div>' +
      '<div class="btnrow"><button class="btn" id="' + prefix + 'Check">Check answers</button>' +
      '<button class="btn ghost" id="' + prefix + 'Reset">Try again</button>' +
      '<span class="scoreline" id="' + prefix + 'Score"></span></div>';
  }

  /* ---------- True / False ---------- */
  function buildTF(t, card) {
    var prefix = t.id + "tf";
    card.innerHTML = sectionShell("Activity " + t.nav.slice(-1) + ".1", "True or false?",
      "Read the statements and decide if they are true or false, using the text.", "", prefix);
    var body = card.querySelector("#" + prefix + "Body");
    var score = card.querySelector("#" + prefix + "Score");
    var ids = [];

    function render() {
      body.innerHTML = ""; score.textContent = ""; ids = [];
      t.tf.forEach(function (it, i) {
        var id = TFREG.length;
        TFREG.push({ item: it, sel: null });
        ids.push(id);
        var div = document.createElement("div");
        div.className = "item";
        div.innerHTML = '<p class="q"><span class="n">' + (i + 1) + '</span>' + esc(it.q) + '</p>' +
          '<div class="opts"><button class="opt" data-tfid="' + id + '" data-v="1">True</button>' +
          '<button class="opt" data-tfid="' + id + '" data-v="0">False</button></div>' +
          '<div class="fb" data-tfid="' + id + '"></div>';
        body.appendChild(div);
      });
    }

    body.addEventListener("click", function (e) {
      var b = e.target.closest(".opt");
      if (!b || b.disabled) return;
      var rec = TFREG[+b.getAttribute("data-tfid")];
      rec.sel = b.getAttribute("data-v") === "1";
      Array.prototype.forEach.call(b.parentNode.children, function (x) { x.classList.remove("sel"); });
      b.classList.add("sel");
    });

    card.querySelector("#" + prefix + "Check").addEventListener("click", function () {
      var ok = 0;
      ids.forEach(function (id) {
        var rec = TFREG[id], it = rec.item;
        var good = rec.sel === it.a;
        if (good) ok++;
        var btns = body.querySelectorAll('.opt[data-tfid="' + id + '"]');
        Array.prototype.forEach.call(btns, function (b) {
          var v = b.getAttribute("data-v") === "1";
          b.disabled = true;
          b.classList.remove("sel");
          if (v === it.a) b.classList.add("good");
          else if (rec.sel === v) b.classList.add("bad");
        });
        var sol = 'The answer is <span class="sol">' + (it.a ? "True" : "False") + '</span>.';
        body.querySelector('.fb[data-tfid="' + id + '"]').innerHTML = expl(good, sol, it.ev, it.why, it.tip);
      });
      score.textContent = scoreText(ok, ids.length);
    });
    card.querySelector("#" + prefix + "Reset").addEventListener("click", render);
    render();
  }

  /* ---------- Choose the correct option ---------- */
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x;
    }
    return a;
  }

  function buildComp(t, card) {
    var prefix = t.id + "cp";
    card.innerHTML = sectionShell("Activity " + t.nav.slice(-1) + ".2", "Choose the correct option",
      "Read each sentence and choose the option that fits the gap.", "", prefix);
    var body = card.querySelector("#" + prefix + "Body");
    var score = card.querySelector("#" + prefix + "Score");
    var ids = [];

    function render() {
      body.innerHTML = ""; score.textContent = ""; ids = [];
      t.comp.forEach(function (it, i) {
        var right = t.box[it.word];
        var opts = shuffle([right].concat(it.d));
        var id = COMPREG.length;
        COMPREG.push({ item: it, right: right, sel: null });
        ids.push(id);
        var div = document.createElement("div");
        div.className = "item";
        var optsH = opts.map(function (o) {
          return '<button class="opt" data-cpid="' + id + '" data-o="' + esc(o) + '">' + esc(o) + '</button>';
        }).join("");
        div.innerHTML = '<p class="q"><span class="n">' + (i + 1) + '</span>' + esc(it.begin) + ' ' + endHtml(t.endings[it.end]) + '</p>' +
          '<div class="opts">' + optsH + '</div><div class="fb" data-cpid="' + id + '"></div>';
        body.appendChild(div);
      });
    }

    body.addEventListener("click", function (e) {
      var b = e.target.closest(".opt");
      if (!b || b.disabled) return;
      COMPREG[+b.getAttribute("data-cpid")].sel = b.getAttribute("data-o");
      Array.prototype.forEach.call(b.parentNode.children, function (x) { x.classList.remove("sel"); });
      b.classList.add("sel");
    });

    card.querySelector("#" + prefix + "Check").addEventListener("click", function () {
      var ok = 0;
      ids.forEach(function (id) {
        var rec = COMPREG[id], it = rec.item;
        var good = rec.sel === rec.right;
        if (good) ok++;
        var btns = body.querySelectorAll('.opt[data-cpid="' + id + '"]');
        Array.prototype.forEach.call(btns, function (b) {
          var o = b.getAttribute("data-o");
          b.disabled = true; b.classList.remove("sel");
          if (o === rec.right) b.classList.add("good");
          else if (o === rec.sel) b.classList.add("bad");
        });
        var full = it.begin + " " + t.endings[it.end].replace("___", rec.right);
        var sol = 'Full sentence: <span class="sol">' + esc(full) + '</span>';
        body.querySelector('.fb[data-cpid="' + id + '"]').innerHTML = expl(good, sol, null, it.why, it.tip);
      });
      score.textContent = scoreText(ok, ids.length);
    });
    card.querySelector("#" + prefix + "Reset").addEventListener("click", render);
    render();
  }

  function optsHtml(list, useLetters) {
    var h = '<option value="">?</option>';
    list.forEach(function (x, i) { h += '<option value="' + i + '">' + (useLetters ? LETTERS[i] : esc(x)) + '</option>'; });
    return h;
  }

  /* ---------- Match expressions ---------- */
  function buildVocab(t, card) {
    var prefix = t.id + "vc";
    card.innerHTML = sectionShell("Activity " + t.nav.slice(-1) + ".3", "Match expressions with their meanings",
      "Find each highlighted expression in the text. Choose the definition that matches.", "", prefix);
    var body = card.querySelector("#" + prefix + "Body");
    var score = card.querySelector("#" + prefix + "Score");
    var ids = [];

    function render() {
      body.innerHTML = ""; score.textContent = ""; ids = [];
      var defsH = t.defs.map(function (d, i) { return "<li><b>" + LETTERS[i] + ".</b>" + esc(d) + "</li>"; }).join("");
      var info = document.createElement("div");
      info.innerHTML = '<div class="box"><div class="bt">Definitions</div><ul class="ends">' + defsH + '</ul></div>';
      body.appendChild(info);
      t.vocab.forEach(function (it, i) {
        var id = VOCREG.length;
        VOCREG.push({ item: it });
        ids.push(id);
        var div = document.createElement("div");
        div.className = "item";
        div.innerHTML = '<p class="q"><span class="n">' + (i + 1) + '</span><b class="hl">' + esc(it.term) + '</b> (paragraph ' + it.para + ')</p>' +
          '<div class="selrow"><label>Meaning</label><select data-vcid="' + id + '">' + optsHtml(t.defs, true) + '</select></div>' +
          '<div class="fb" data-vcid="' + id + '"></div>';
        body.appendChild(div);
      });
    }

    card.querySelector("#" + prefix + "Check").addEventListener("click", function () {
      var ok = 0;
      ids.forEach(function (id) {
        var it = VOCREG[id].item;
        var s = body.querySelector('select[data-vcid="' + id + '"]');
        var good = s.value !== "" && +s.value === it.def;
        s.className = good ? "ok" : "no"; s.disabled = true;
        if (good) ok++;
        var sol = 'Answer: <span class="sol">' + LETTERS[it.def] + '</span> - ' + esc(t.defs[it.def]);
        body.querySelector('.fb[data-vcid="' + id + '"]').innerHTML = expl(good, sol, null, it.why, it.tip);
      });
      score.textContent = scoreText(ok, ids.length);
    });
    card.querySelector("#" + prefix + "Reset").addEventListener("click", render);
    render();
  }

  /* ---------- page ---------- */
  var app = document.getElementById("app");
  var nav = document.getElementById("nav");
  DATA.texts.forEach(function (t) {
    var a = document.createElement("a");
    a.href = "#" + t.id; a.textContent = t.nav + " - " + t.level;
    nav.appendChild(a);

    var read = document.createElement("section");
    read.className = "card"; read.id = t.id;
    read.innerHTML = '<div class="tag">' + esc(t.nav) + ' &middot; ' + esc(t.level) + '</div><h2>' + esc(t.title) + '</h2>' +
      '<p class="sub">Read the text. The highlighted expressions are used in Activity ' + t.nav.slice(-1) + '.3.</p>' +
      '<div class="read">' + t.paras.map(function (p) { return "<p>" + fmt(p) + "</p>"; }).join("") + '</div>';
    app.appendChild(read);

    [buildTF, buildComp, buildVocab].forEach(function (fn) {
      var c = document.createElement("section");
      c.className = "card";
      app.appendChild(c);
      fn(t, c);
    });
  });
})();
</script>
</body>
</html>
