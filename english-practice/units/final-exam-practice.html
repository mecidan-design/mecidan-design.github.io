<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final Exam Practice · Use of English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff2d95; --violet:#7b2ff7; --cyan:#00e5ff;
  --yellow:#fff200; --lime:#baff29; --ink:#0d0d0d;
  --head:"Baloo 2","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;
  --body:"Poppins","Segoe UI",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); color:var(--ink); min-height:100vh; padding:26px 14px 70px;
  background:
    radial-gradient(rgba(0,0,0,.13) 1.4px, transparent 1.5px) 0 0/17px 17px,
    linear-gradient(135deg,#ff2d95 0%,#c02be0 32%,#7b2ff7 58%,#00e5ff 100%);
  background-attachment:fixed;
}
.wrap{max-width:880px;margin:0 auto}

/* ---------- header ---------- */
.hero{
  background:var(--ink); border:5px solid #000; border-radius:24px;
  box-shadow:12px 12px 0 var(--cyan); padding:22px 24px; margin-bottom:34px;
  transform:rotate(-.7deg);
}
.hero h1{
  font-family:var(--head); font-weight:800; color:#fff; margin:0;
  font-size:clamp(1.7rem,5.4vw,2.9rem); line-height:1.05; letter-spacing:.5px;
  text-shadow:3px 3px 0 var(--pink), 6px 6px 0 var(--violet);
}
.hero p{font-family:var(--head);color:var(--lime);margin:.5rem 0 0;font-size:1rem;font-weight:600}

/* ---------- cards ---------- */
.card{
  background:#fff; border:4px solid #000; border-radius:20px; padding:22px 22px 24px;
  margin-bottom:34px; position:relative;
}
.card:nth-of-type(3n+1){box-shadow:10px 10px 0 var(--pink);  transform:rotate(-.45deg)}
.card:nth-of-type(3n+2){box-shadow:10px 10px 0 var(--violet);transform:rotate(.4deg)}
.card:nth-of-type(3n+3){box-shadow:10px 10px 0 var(--cyan);  transform:rotate(-.3deg)}


.tag{
  display:inline-block; font-family:var(--head); font-weight:800; font-size:.82rem;
  background:var(--yellow); border:3px solid #000; border-radius:999px;
  padding:3px 14px; margin-bottom:10px; text-transform:uppercase; letter-spacing:1px;
}
.card h2{font-family:var(--head);font-weight:800;font-size:1.55rem;margin:.1rem 0 .3rem;line-height:1.15}
.sub{font-size:.9rem;color:#4a4a4a;margin:0 0 18px}

/* ---------- buttons ---------- */
.btn{
  font-family:var(--head); font-weight:800; font-size:1rem; color:#fff; cursor:pointer;
  background:linear-gradient(90deg,var(--pink),var(--violet));
  border:3px solid #000; border-radius:999px; padding:10px 26px;
  box-shadow:5px 5px 0 #000; transition:transform .07s, box-shadow .07s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translate(5px,5px);box-shadow:0 0 0 #000}
.btn.ghost{background:#fff;color:#000}
.btn[disabled]{opacity:.45;cursor:default;transform:none;box-shadow:5px 5px 0 #000}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:20px}

/* ---------- inputs ---------- */
input[type=text]{
  font-family:var(--body); font-size:1rem; font-weight:500; padding:7px 11px;
  border:3px solid #000; border-radius:11px; background:#fffdf2; outline:none;
}
input[type=text]:focus{background:#fff;box-shadow:0 0 0 4px var(--cyan)}
input.ok{background:#e4ffc4;border-color:#1c7a00}
input.no{background:#ffe0ec;border-color:#c2004c}

/* ---------- passage + gaps ---------- */
.passage{font-size:1.06rem;line-height:3.05;margin:0}
.gapwrap{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px}
.gline{display:flex;align-items:center;gap:5px}
.gnum{
  font-family:var(--head);font-size:.72rem;font-weight:800;color:#fff;background:var(--violet);
  border:2px solid #000;border-radius:50%;width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.gapwrap input{width:132px;text-align:center}
.cue{font-family:var(--head);font-size:.74rem;font-weight:700;color:var(--violet);line-height:1.1;margin-top:1px}

/* ---------- explanation blocks ---------- */
.exp{
  border:3px solid #000;border-radius:14px;padding:12px 14px;margin-top:12px;
  background:#f4efff;font-size:.93rem;line-height:1.5;
}
.exp.right{background:#f0ffe0}
.exp.wrong{background:#fff0f5}
.exp b.lab{
  font-family:var(--head);font-size:.76rem;text-transform:uppercase;letter-spacing:.9px;
  display:inline-block;border:2px solid #000;border-radius:999px;padding:0 9px;margin-right:7px;
}
.lab.why{background:var(--cyan)}
.lab.tip{background:var(--yellow)}
.exp p{margin:0 0 7px}
.exp p:last-child{margin-bottom:0}
.sol{font-family:var(--head);font-weight:800;color:#12006b}

.panel{margin-top:24px;display:none}
.panel h3{font-family:var(--head);font-size:1.2rem;margin:0 0 12px}
.pitem{border-left:8px solid var(--violet);padding-left:12px;margin-bottom:16px}
.pitem .ptop{font-family:var(--head);font-weight:800;font-size:1rem;margin-bottom:2px}
.mark{font-family:var(--head);font-weight:800;font-size:.8rem;border:2px solid #000;border-radius:999px;padding:1px 10px;margin-left:8px}
.mark.y{background:var(--lime)}
.mark.n{background:#ff9dc4}

/* ---------- items (mcq / kwt) ---------- */
.item{border:3px solid #000;border-radius:16px;padding:15px 16px;margin-bottom:18px;background:#fff}
.item .q{font-size:1.04rem;font-weight:500;margin:0 0 11px;line-height:1.5}
.opts{display:flex;flex-wrap:wrap;gap:9px}
.opt{
  font-family:var(--body);font-size:.97rem;font-weight:500;cursor:pointer;background:#fff;
  border:3px solid #000;border-radius:999px;padding:7px 17px;box-shadow:3px 3px 0 #000;
  transition:transform .07s,box-shadow .07s;
}
.opt:hover{background:#fff9c9}
.opt.sel{background:var(--cyan);transform:translate(3px,3px);box-shadow:0 0 0 #000}
.opt.good{background:var(--lime);border-color:#1c7a00}
.opt.bad{background:#ffc2d8;text-decoration:line-through;border-color:#c2004c}
.opt[disabled]{cursor:default}

.kwt .lead{font-size:1.04rem;margin:0 0 9px;line-height:1.5}
.keyw{
  font-family:var(--head);font-weight:800;letter-spacing:1.6px;background:var(--yellow);
  border:3px solid #000;border-radius:8px;padding:2px 12px;display:inline-block;margin:0 0 10px;
}
.kwt .target{font-size:1.04rem;line-height:2.5}
.kwt input{width:290px;max-width:100%}
.wc{font-family:var(--head);font-size:.76rem;font-weight:700;color:#5b5b5b;margin-top:6px}
.wc.bad{color:#c2004c}

/* ---------- word formation (raiz debajo del hueco, en el propio texto) ---------- */
.cue.root{
  font-family:var(--head);font-weight:800;font-size:.7rem;letter-spacing:1.1px;
  color:#000;background:var(--cyan);border:2px solid #000;border-radius:6px;
  padding:0 7px;margin-top:2px;
}
#wfText .gapwrap input{width:150px}

/* ---------- multiple-choice cloze ---------- */
.mcgap{
  display:inline-flex;align-items:center;gap:5px;vertical-align:middle;margin:0 3px;
  border:3px solid #000;border-radius:11px;padding:3px 9px;background:#fffdf2;min-width:118px;
}
.mcgap.ok{background:#e4ffc4;border-color:#1c7a00}
.mcgap.no{background:#ffe0ec;border-color:#c2004c}
.mcpick{font-weight:600;font-size:.97rem}
.mcpick.empty{color:#9a9a9a;letter-spacing:2px}
.mcrow{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.mcrow .rn{
  font-family:var(--head);font-size:.75rem;font-weight:800;color:#fff;background:var(--violet);
  border:2px solid #000;border-radius:50%;width:21px;height:21px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.mcrow .opt{font-size:.9rem;padding:5px 13px;box-shadow:2px 2px 0 #000}
.mcrow .letter{font-family:var(--head);font-weight:800;margin-right:5px}

/* ---------- warm-up ---------- */
.card.warm{background:var(--ink);border-color:#000;box-shadow:10px 10px 0 var(--yellow)}
.warm h2,.warm .sub{color:#fff}
.warm .sub{color:#c9c9c9}
.dots{display:flex;gap:7px;margin:14px 0 18px}
.dot{width:15px;height:15px;border-radius:50%;border:3px solid #fff;background:transparent}
.dot.y{background:var(--lime);border-color:var(--lime)}
.dot.n{background:var(--pink);border-color:var(--pink)}
.dot.now{box-shadow:0 0 0 3px var(--cyan)}
.hud{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.chip{
  font-family:var(--head);font-weight:800;font-size:.85rem;border:3px solid #000;border-radius:999px;
  padding:3px 15px;background:var(--cyan);
}
.chip.streak{background:var(--pink);color:#fff}
.warm .qbox{background:#fff;border:4px solid #fff;border-radius:16px;padding:16px;margin-top:6px}
.final{text-align:center;padding:14px 6px}
.final .big{font-family:var(--head);font-weight:800;font-size:3.3rem;color:var(--yellow);line-height:1;margin:6px 0}
.final .msg{font-family:var(--head);font-weight:700;color:#fff;font-size:1.25rem;margin-bottom:14px}
.hidden{display:none}
.scoreline{font-family:var(--head);font-weight:800;font-size:1.05rem;margin-top:14px}

/* ---------- test: cabecera de ejercicio ---------- */
.card.ex{padding-top:18px}
.exhead{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.exnum{
  font-family:var(--head);font-weight:800;font-size:1.1rem;color:#fff;background:var(--violet);
  border:3px solid #000;border-radius:50%;width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.expts{
  font-family:var(--head);font-weight:800;font-size:.78rem;background:var(--yellow);
  border:3px solid #000;border-radius:999px;padding:2px 13px;text-transform:uppercase;letter-spacing:.8px;
}
.rubric{font-weight:600;font-size:1.02rem;margin:0 0 12px;line-height:1.45}
.intro{
  font-size:1rem;line-height:1.55;margin:0 0 16px;background:#fffdf2;
  border:3px solid #000;border-radius:14px;padding:12px 14px;
}
.situation{
  font-size:1rem;line-height:1.55;margin:0 0 14px;background:#f4efff;
  border:3px dashed #000;border-radius:14px;padding:12px 14px;
}

/* ---------- matching ---------- */
.mline{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px}
.mtext{font-size:1.01rem;line-height:1.45;font-weight:500}
.rn{
  font-family:var(--head);font-size:.75rem;font-weight:800;color:#fff;background:var(--violet);
  border:2px solid #000;border-radius:50%;width:21px;height:21px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;margin-top:2px;
}
select.pick{
  font-family:var(--body);font-size:.95rem;font-weight:600;padding:7px 11px;
  border:3px solid #000;border-radius:11px;background:#fff;cursor:pointer;max-width:100%;
}
select.pick.ok{background:#e4ffc4;border-color:#1c7a00}
select.pick.no{background:#ffe0ec;border-color:#c2004c}

/* ---------- transform / gapsentences ---------- */
.item .lead{font-size:1.02rem;margin:0 0 9px;line-height:1.5;display:flex;align-items:flex-start;gap:8px}
.item .target{font-size:1.02rem;line-height:2.6}
.item input{width:210px}
.item input.wide{width:100%;max-width:520px;text-align:left}

/* ---------- caja de gramatica previa, al estilo "explore grammar" ---------- */
.gnote{
  border:4px solid #000;border-radius:16px;padding:13px 16px;margin:0 0 16px;
  background:#fff7e0;box-shadow:5px 5px 0 var(--yellow);font-size:.96rem;line-height:1.55;
}
.gnotetitle{font-family:var(--head);font-size:1.05rem;display:block;margin-bottom:6px}
.gnote ul{margin:0;padding-left:19px}
.gnote li{margin-bottom:5px}
.gform{
  font-family:var(--head);font-weight:800;background:var(--cyan);
  border:2px solid #000;border-radius:6px;padding:0 7px;display:inline-block;
}
.gwarn{margin:9px 0 0;background:#ffe0ec;border:2px solid #000;border-radius:10px;padding:7px 11px}

/* ---------- writing ---------- */
.wline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.wlab{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.wform{
  font-family:var(--head);font-weight:800;font-size:.8rem;background:var(--lime);
  border:2px solid #000;border-radius:999px;padding:2px 11px;white-space:nowrap;
}
.wline input{flex:1 1 300px;min-width:220px}
textarea{
  font-family:var(--body);font-size:1rem;font-weight:500;width:100%;padding:11px 13px;
  border:3px solid #000;border-radius:14px;background:#fffdf2;outline:none;resize:vertical;
}
textarea:focus{background:#fff;box-shadow:0 0 0 4px var(--cyan)}
.needlist{
  margin-top:13px;border:3px solid #000;border-radius:14px;padding:11px 14px;background:#f0ffe0;
  font-size:.93rem;line-height:1.5;
}
.needlist ul{margin:6px 0 0;padding-left:20px}
.needtitle{font-family:var(--head);font-size:.9rem;display:block;margin-bottom:2px}
.modelbox{
  border:3px solid #000;border-radius:14px;padding:12px 14px;background:#fffdf2;
  font-size:.93rem;line-height:1.55;margin-top:6px;
}
.modelbox p{margin:6px 0 0}
.selfnote{font-style:italic;color:#5b5b5b;font-size:.86rem}

/* ---------- marcador global ---------- */
.totalcard{
  background:var(--ink);border:5px solid #000;border-radius:22px;box-shadow:10px 10px 0 var(--lime);
  padding:16px 20px;margin-bottom:34px;position:sticky;top:8px;z-index:5;
}
.totalcard .lbl{font-family:var(--head);font-weight:800;color:var(--yellow);font-size:.8rem;
  text-transform:uppercase;letter-spacing:1.2px}
.totalcard .val{font-family:var(--head);font-weight:800;color:#fff;font-size:1.5rem;line-height:1.2}
.track{height:14px;border:3px solid #fff;border-radius:999px;margin-top:9px;overflow:hidden;background:transparent}
.track span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--cyan));transition:width .25s}

/* ---------- final: selector de niveles en el header ---------- */
.hero{transform:none}
.hero .tabs{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.tab{
  font-family:var(--head);font-weight:800;font-size:1.05rem;color:#fff;cursor:pointer;
  background:transparent;border:3px solid #fff;border-radius:999px;padding:7px 20px 6px;
  box-shadow:5px 5px 0 var(--pink);transition:transform .07s,box-shadow .07s;text-align:center;line-height:1.1;
}
.tab small{display:block;font-size:.68rem;font-weight:700;letter-spacing:.6px;opacity:.9;margin-top:1px}
.tab:hover{filter:brightness(1.12)}
.tab[data-l="1"]{box-shadow:5px 5px 0 var(--cyan)}
.tab[data-l="2"]{box-shadow:5px 5px 0 var(--lime)}
.tab[data-l="3"]{box-shadow:5px 5px 0 var(--yellow)}
.tab.on{background:var(--yellow);color:#000;border-color:#000;transform:translate(4px,4px);box-shadow:0 0 0 #000}
.tab[data-l="3"]:not(.on){background:linear-gradient(90deg,var(--pink),var(--violet))}

.level{display:none}
.level.on{display:block}
.levelhead{
  background:#fff;border:4px solid #000;border-radius:18px;box-shadow:8px 8px 0 var(--violet);
  padding:14px 20px;margin-bottom:34px;
}
.levelhead .tag{margin-bottom:6px}
.levelhead b{font-family:var(--head);font-size:1.4rem;display:block;line-height:1.15}
.levelhead span.t{font-size:.95rem;color:#4a4a4a;display:block;margin-top:4px;line-height:1.5}

.item input.wide{width:100%;max-width:520px;text-align:left}
.item .q{font-size:1.04rem;font-weight:500;margin:0 0 11px;line-height:1.5}

.verdict{
  display:none;background:var(--ink);border:5px solid #000;border-radius:22px;box-shadow:10px 10px 0 var(--yellow);
  padding:20px 22px;margin-bottom:34px;text-align:center;
}
.verdict.on{display:block}
.verdict .big{font-family:var(--head);font-weight:800;font-size:2.6rem;color:var(--yellow);line-height:1.05}
.verdict .msg{font-family:var(--head);font-weight:700;color:#fff;font-size:1.15rem;margin-top:8px;line-height:1.35}
.verdict .msg2{font-family:var(--head);font-weight:700;color:var(--lime);font-size:1rem;margin-top:8px}

footer{
  text-align:center;font-family:var(--head);font-weight:700;color:#fff;
  text-shadow:2px 2px 0 #000;margin-top:34px;font-size:.95rem;
}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <h1 id="testTitle"></h1>
    <p id="testSub"></p>
    <div class="tabs" id="tabs"></div>
  </header>

  <div class="totalcard">
    <div class="lbl" id="totalLbl">Running total</div>
    <div class="val" id="total"></div>
    <div class="track"><span id="totalBar"></span></div>
  </div>

  <div id="levels"></div>

</div>
<footer>Copyright Prof Dan M. Mecikovsky</footer>

<script id="engine-block">
(function(){
"use strict";

/* Registry: el DOM guarda solo indices numericos, nunca JSON serializado. */
var REG = [];

function normalize(s){
  return String(s).toLowerCase()
    .replace(/[‘’ʼ]/g, "'")
    .replace(/[^a-z0-9' ]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function countWords(s){
  s = String(s).replace(/\bcannot\b/gi, "can not");
  var t = String(s).toLowerCase().replace(/[‘’ʼ]/g, "'");
  t = t.replace(/n't\b/g, " not")
       .replace(/'ll\b/g, " will")
       .replace(/'re\b/g, " are")
       .replace(/'ve\b/g, " have")
       .replace(/'m\b/g, " am")
       .replace(/'d\b/g, " would");
  t = t.replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  return t === "" ? 0 : t.split(" ").length;
}

function matches(given, list){
  var g = normalize(given);
  if(g === "") return false;
  for(var i = 0; i < list.length; i++){ if(normalize(list[i]) === g) return true; }
  return false;
}

function el(tag, cls, txt){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(txt !== undefined && txt !== null) n.textContent = txt;
  return n;
}

function explainBox(ok, answerText, why, tip, note){
  var box = el("div", "exp " + (ok ? "right" : "wrong"));
  if(answerText){
    var p0 = el("p");
    p0.appendChild(el("span", "sol", "Answer: " + answerText));
    box.appendChild(p0);
  }
  if(note){
    var pn = el("p");
    pn.appendChild(el("b", "lab tip", "Length"));
    pn.appendChild(document.createTextNode(note));
    box.appendChild(pn);
  }
  var p1 = el("p");
  p1.appendChild(el("b", "lab why", "Why"));
  p1.appendChild(document.createTextNode(why));
  box.appendChild(p1);
  var p2 = el("p");
  p2.appendChild(el("b", "lab tip", "Exam tip"));
  p2.appendChild(document.createTextNode(tip));
  box.appendChild(p2);
  return box;
}

function clearExp(scope){
  var old = scope.querySelectorAll(".exp");
  for(var i = 0; i < old.length; i++){ old[i].parentNode.removeChild(old[i]); }
}

function buildGappedText(container, text, makeGap){
  container.innerHTML = "";
  var chunks = String(text).split(/\{(\d+)\}/);
  for(var i = 0; i < chunks.length; i++){
    if(i % 2 === 0){
      if(chunks[i]) container.appendChild(document.createTextNode(chunks[i]));
    } else {
      container.appendChild(makeGap(parseInt(chunks[i], 10)));
    }
  }
}

function alsoText(answers){
  return answers.length > 1 ? "  (also: " + answers.slice(1).join(" / ") + ")" : "";
}

/* ============================================================
   Estado: niveles, tarjetas y puntajes
   ============================================================ */
var LEVELS = DATA.levels;
var SCORES = [];          /* SCORES[nivel][ejercicio] = { pts, max, done } */
var ROOTS = [];           /* contenedor de cada nivel */
var VERDICTS = [];
var TABS = [];
var ACTIVE = 0;

function markCount(ex){ return ex.items.length; }

function levelTotal(l){
  var t = 0;
  for(var i = 0; i < LEVELS[l].exercises.length; i++){ t += markCount(LEVELS[l].exercises[i]); }
  return t;
}

function card(ex, l, e){
  var sec = el("section", "card ex");

  var head = el("div", "exhead");
  head.appendChild(el("span", "exnum", String(ex.n)));
  head.appendChild(el("span", "expts", ex.label));
  head.appendChild(el("span", "expts", markCount(ex) + " marks"));
  sec.appendChild(head);

  sec.appendChild(el("p", "rubric", ex.rubric));
  if(ex.intro) sec.appendChild(el("p", "intro", ex.intro));

  var body = el("div", "exbody");
  sec.appendChild(body);

  var row = el("div", "btnrow");
  var check = el("button", "btn", "Check");
  check.type = "button";
  var again = el("button", "btn ghost", "Try again");
  again.type = "button";
  row.appendChild(check);
  row.appendChild(again);
  var score = el("span", "scoreline");
  row.appendChild(score);
  sec.appendChild(row);

  var panel = el("div", "panel");
  panel.appendChild(el("h3", null, "Answers & explanations"));
  var panelBody = el("div");
  panel.appendChild(panelBody);
  sec.appendChild(panel);

  ROOTS[l].appendChild(sec);
  return { sec: sec, body: body, check: check, again: again, score: score, panel: panel, panelBody: panelBody, l: l, e: e };
}

function fillPanel(body, rows, word){
  body.innerHTML = "";
  for(var i = 0; i < rows.length; i++){
    var r = rows[i];
    var item = el("div", "pitem");
    var top = el("div", "ptop");
    top.appendChild(document.createTextNode((word || "Item") + " " + r.num));
    top.appendChild(el("span", "mark " + (r.ok ? "y" : "n"), r.ok ? "correct" : "not yet"));
    item.appendChild(top);
    item.appendChild(explainBox(r.ok, r.shown, r.why, r.tip, r.note));
    body.appendChild(item);
  }
}

function setScore(ui, right, total){
  SCORES[ui.l][ui.e] = { pts: right, max: total, done: true };
  ui.score.textContent = right + " / " + total + " marks";
  updateAll();
}

function clearScore(ui){
  SCORES[ui.l][ui.e] = null;
  ui.score.textContent = "";
  updateAll();
}

/* ---------- marcador, pestañas y veredicto ---------- */
var totalEl = document.getElementById("total");
var totalBar = document.getElementById("totalBar");
var totalLbl = document.getElementById("totalLbl");

function stats(l){
  var got = 0, of = 0, done = 0;
  for(var i = 0; i < SCORES[l].length; i++){
    var s = SCORES[l][i];
    if(s && s.done){ got += s.pts; of += s.max; done++; }
  }
  return { got: got, of: of, done: done, all: levelTotal(l) };
}

function verdictFor(l, st){
  var pct = Math.round((st.got / st.all) * 100);
  var big = st.got + " / " + st.all + "  (" + pct + "%)";
  var msg, msg2 = "";
  var last = (l === LEVELS.length - 1);
  if(pct >= 90){
    msg = last ? "MASTERMIND UNLOCKED. Nothing in this year's English can surprise you now."
               : "Excellent. This level is yours.";
  } else if(pct >= 70){
    msg = "Strong result. Read the tips of the ones you missed and try them again.";
  } else if(pct >= 50){
    msg = "Good start. Use Try again on the exercises with the most mistakes.";
  } else {
    msg = "Keep going. Read every Why and Exam tip, then try again.";
  }
  if(!last && pct >= 70){ msg2 = "Ready for the next level: " + LEVELS[l + 1].name; }
  if(last && pct < 90){ msg2 = "You need 90% to become a Mastermind."; }
  return { big: big, msg: msg, msg2: msg2 };
}

function updateAll(){
  for(var l = 0; l < LEVELS.length; l++){
    var st = stats(l);
    var small = TABS[l].querySelector("small");
    small.textContent = st.done ? (st.got + " / " + st.of + " so far") : (st.all + " marks");

    var v = VERDICTS[l];
    if(st.done === LEVELS[l].exercises.length){
      var r = verdictFor(l, st);
      v.innerHTML = "";
      v.appendChild(el("div", "big", r.big));
      v.appendChild(el("div", "msg", r.msg));
      if(r.msg2) v.appendChild(el("div", "msg2", r.msg2));
      v.className = "verdict on";
    } else {
      v.className = "verdict";
    }
  }
  var a = stats(ACTIVE);
  totalLbl.textContent = "Running total  ·  " + LEVELS[ACTIVE].name;
  totalEl.textContent = a.of ? a.got + " / " + a.of + " marks so far" : "Nothing checked yet";
  totalBar.style.width = a.of ? Math.round((a.got / a.of) * 100) + "%" : "0%";
}

function activate(l){
  ACTIVE = l;
  for(var i = 0; i < LEVELS.length; i++){
    ROOTS[i].className = "level" + (i === l ? " on" : "");
    TABS[i].className = "tab" + (i === l ? " on" : "");
    TABS[i].setAttribute("aria-pressed", i === l ? "true" : "false");
  }
  updateAll();
  window.scrollTo(0, 0);
}

/* ============================================================
   kwt / gapsentences: un input por item
   ============================================================ */
function renderInputItems(ex, ui, kind){
  var entries = [];

  function build(){
    ui.body.innerHTML = "";
    entries = [];
    for(var i = 0; i < ex.items.length; i++){
      var d = ex.items[i];
      var item = el("div", "item");

      if(d.lead){
        var lead = el("p", "lead");
        lead.appendChild(el("b", "rn", String(i + 1)));
        lead.appendChild(document.createTextNode(" " + d.lead));
        item.appendChild(lead);
      }
      if(d.key) item.appendChild(el("div", "keyw", d.key));

      var line = el("div", "target");
      if(!d.lead){
        line.appendChild(el("b", "rn", String(i + 1)));
        line.appendChild(document.createTextNode(" "));
      }
      if(d.before) line.appendChild(document.createTextNode(d.before + " "));
      var inp = document.createElement("input");
      inp.type = "text";
      inp.className = kind === "kwt" ? "wide" : "";
      inp.setAttribute("autocomplete", "off");
      inp.setAttribute("spellcheck", "false");
      line.appendChild(inp);
      if(d.after) line.appendChild(document.createTextNode(" " + d.after));
      item.appendChild(line);

      var wc = null;
      if(kind === "kwt"){
        wc = el("div", "wc", "words: 0  (you need 2 - 5)");
        item.appendChild(wc);
        (function(inpEl, wcEl){
          inpEl.addEventListener("input", function(){
            var n = countWords(inpEl.value);
            wcEl.textContent = "words: " + n + "  (you need 2 - 5)";
            wcEl.className = (n >= 2 && n <= 5) ? "wc" : "wc bad";
          });
        })(inp, wc);
      }
      ui.body.appendChild(item);
      entries.push({ id: REG.push({ data: d }) - 1, item: item, inp: inp });
    }
  }
  build();

  ui.check.addEventListener("click", function(){
    var right = 0;
    clearExp(ui.body);
    for(var i = 0; i < entries.length; i++){
      var en = entries[i];
      var d = REG[en.id].data;
      var ok = matches(en.inp.value, d.answers);
      var note = null;
      if(kind === "kwt"){
        var n = countWords(en.inp.value);
        if(ok && (n < 2 || n > 5)) ok = false;
        if(en.inp.value.trim() !== "" && (n < 2 || n > 5)){
          note = "Your answer has " + n + " words. Remember that short forms count as two: don't = do + not.";
        }
      }
      if(ok) right++;
      en.inp.className = (kind === "kwt" ? "wide " : "") + (ok ? "ok" : "no");
      var shown = d.answers[0];
      if(kind === "kwt") shown += "  (" + countWords(d.answers[0]) + " words)";
      shown += alsoText(d.answers);
      en.item.appendChild(explainBox(ok, shown, d.why, d.tip, note));
    }
    setScore(ui, right, entries.length);
  });
  ui.again.addEventListener("click", function(){
    build();
    clearScore(ui);
  });
}

/* ============================================================
   wordform / opencloze: texto corrido con huecos
   ============================================================ */
function renderGapText(ex, ui, withRoot){
  var textEl = el("p", "passage");
  ui.body.appendChild(textEl);
  var entries = [];

  function build(){
    entries = [];
    buildGappedText(textEl, ex.text, function(num){
      var d = ex.items[num - 1];
      var wrap = el("span", "gapwrap");
      var line = el("span", "gline");
      line.appendChild(el("b", "gnum", String(num)));
      var inp = document.createElement("input");
      inp.type = "text";
      inp.setAttribute("autocomplete", "off");
      inp.setAttribute("spellcheck", "false");
      line.appendChild(inp);
      wrap.appendChild(line);
      if(withRoot) wrap.appendChild(el("span", "cue root", d.root));
      entries.push({ num: num, data: d, inp: inp });
      return wrap;
    });
  }
  build();

  ui.check.addEventListener("click", function(){
    var right = 0, rows = [];
    for(var i = 0; i < entries.length; i++){
      var en = entries[i];
      var ok = matches(en.inp.value, en.data.answers);
      if(ok) right++;
      en.inp.className = ok ? "ok" : "no";
      var shown = en.data.answers[0] + (withRoot ? "  (from " + en.data.root + ")" : "") + alsoText(en.data.answers);
      rows.push({ num: en.num, ok: ok, shown: shown, why: en.data.why, tip: en.data.tip });
    }
    fillPanel(ui.panelBody, rows, "Gap");
    ui.panel.style.display = "block";
    setScore(ui, right, entries.length);
  });
  ui.again.addEventListener("click", function(){
    build();
    ui.panel.style.display = "none"; ui.panelBody.innerHTML = "";
    clearScore(ui);
  });
}

/* ============================================================
   mcc: multiple-choice cloze, texto corrido + opciones A-D debajo
   ============================================================ */
var LETTERS = ["A", "B", "C", "D", "E"];

function renderMCC(ex, ui){
  var textEl = el("p", "passage");
  var rowsEl = el("div");
  ui.body.appendChild(textEl);
  ui.body.appendChild(rowsEl);
  var ids = [];

  function bindPick(id, j, btn, row){
    btn.addEventListener("click", function(){
      var en = REG[id];
      if(en.locked) return;
      en.picked = j;
      var sibs = row.querySelectorAll(".opt");
      for(var k = 0; k < sibs.length; k++){ sibs[k].classList.remove("sel"); }
      btn.classList.add("sel");
      var pick = en.gap.querySelector(".mcpick");
      pick.textContent = en.data.options[j];
      pick.className = "mcpick";
    });
  }

  function build(){
    ids = [];
    rowsEl.innerHTML = "";
    buildGappedText(textEl, ex.text, function(num){
      var d = ex.items[num - 1];
      var span = el("span", "mcgap");
      span.appendChild(el("b", "gnum", String(num)));
      span.appendChild(el("span", "mcpick empty", "______"));
      ids.push(REG.push({ num: num, data: d, picked: -1, locked: false, gap: span, row: null }) - 1);
      return span;
    });
    for(var i = 0; i < ids.length; i++){
      var en = REG[ids[i]];
      var row = el("div", "mcrow");
      row.appendChild(el("b", "rn", String(en.num)));
      for(var j = 0; j < en.data.options.length; j++){
        var b = el("button", "opt");
        b.type = "button";
        b.appendChild(el("span", "letter", LETTERS[j]));
        b.appendChild(document.createTextNode(en.data.options[j]));
        bindPick(ids[i], j, b, row);
        row.appendChild(b);
      }
      en.row = row;
      rowsEl.appendChild(row);
    }
  }
  build();

  ui.check.addEventListener("click", function(){
    var right = 0, rows = [];
    for(var i = 0; i < ids.length; i++){
      var en = REG[ids[i]];
      var d = en.data;
      en.locked = true;
      var ok = en.picked === d.correct;
      if(ok) right++;
      var btns = en.row.querySelectorAll(".opt");
      for(var j = 0; j < btns.length; j++){
        btns[j].disabled = true;
        btns[j].classList.remove("sel");
        if(j === d.correct) btns[j].classList.add("good");
        else if(j === en.picked) btns[j].classList.add("bad");
      }
      en.gap.className = "mcgap " + (ok ? "ok" : "no");
      var pick = en.gap.querySelector(".mcpick");
      pick.textContent = d.options[d.correct];
      pick.className = "mcpick";
      rows.push({ num: en.num, ok: ok, shown: LETTERS[d.correct] + "  " + d.options[d.correct], why: d.why, tip: d.tip });
    }
    fillPanel(ui.panelBody, rows, "Gap");
    ui.panel.style.display = "block";
    setScore(ui, right, ids.length);
  });
  ui.again.addEventListener("click", function(){
    build();
    ui.panel.style.display = "none"; ui.panelBody.innerHTML = "";
    clearScore(ui);
  });
}

/* ============================================================
   mcq: una pregunta por item, opciones como botones
   ============================================================ */
function renderMCQ(ex, ui){
  var ids = [];

  function bindPick(id, j, btn, box){
    btn.addEventListener("click", function(){
      var en = REG[id];
      if(en.locked) return;
      en.picked = j;
      var sibs = box.querySelectorAll(".opt");
      for(var k = 0; k < sibs.length; k++){ sibs[k].classList.remove("sel"); }
      btn.classList.add("sel");
    });
  }

  function build(){
    ui.body.innerHTML = "";
    ids = [];
    for(var i = 0; i < ex.items.length; i++){
      var d = ex.items[i];
      var id = REG.push({ data: d, picked: -1, locked: false, item: null, btns: [] }) - 1;
      ids.push(id);
      var item = el("div", "item");
      item.appendChild(el("p", "q", (i + 1) + ".  " + d.q));
      var opts = el("div", "opts");
      for(var j = 0; j < d.options.length; j++){
        var b = el("button", "opt", d.options[j]);
        b.type = "button";
        bindPick(id, j, b, opts);
        opts.appendChild(b);
        REG[id].btns.push(b);
      }
      item.appendChild(opts);
      REG[id].item = item;
      ui.body.appendChild(item);
    }
  }
  build();

  ui.check.addEventListener("click", function(){
    var right = 0;
    clearExp(ui.body);
    for(var i = 0; i < ids.length; i++){
      var en = REG[ids[i]];
      var d = en.data;
      en.locked = true;
      var ok = en.picked === d.correct;
      if(ok) right++;
      for(var j = 0; j < en.btns.length; j++){
        en.btns[j].disabled = true;
        en.btns[j].classList.remove("sel");
        if(j === d.correct) en.btns[j].classList.add("good");
        else if(j === en.picked) en.btns[j].classList.add("bad");
      }
      en.item.appendChild(explainBox(ok, d.options[d.correct], d.why, d.tip, null));
    }
    setScore(ui, right, ids.length);
  });
  ui.again.addEventListener("click", function(){
    build();
    clearScore(ui);
  });
}

/* ---------- arranque ---------- */
document.getElementById("testTitle").textContent = DATA.title;
document.getElementById("testSub").textContent = DATA.subtitle;

var tabsEl = document.getElementById("tabs");
var levelsEl = document.getElementById("levels");

for(var l = 0; l < LEVELS.length; l++){
  var lv = LEVELS[l];
  SCORES.push([]);

  var tab = el("button", "tab");
  tab.type = "button";
  tab.setAttribute("data-l", String(l));
  tab.appendChild(document.createTextNode(lv.name));
  tab.appendChild(el("small", null, ""));
  (function(idx){ tab.addEventListener("click", function(){ activate(idx); }); })(l);
  tabsEl.appendChild(tab);
  TABS.push(tab);

  var root = el("div", "level");
  var head = el("div", "levelhead");
  head.appendChild(el("span", "tag", lv.tag));
  head.appendChild(el("b", null, lv.name));
  head.appendChild(el("span", "t", lv.blurb));
  root.appendChild(head);
  levelsEl.appendChild(root);
  ROOTS.push(root);

  for(var e = 0; e < lv.exercises.length; e++){
    var ex = lv.exercises[e];
    SCORES[l].push(null);
    var ui = card(ex, l, e);
    if(ex.type === "kwt") renderInputItems(ex, ui, "kwt");
    else if(ex.type === "gapsentences") renderInputItems(ex, ui, "gaps");
    else if(ex.type === "wordform") renderGapText(ex, ui, true);
    else if(ex.type === "opencloze") renderGapText(ex, ui, false);
    else if(ex.type === "mcc") renderMCC(ex, ui);
    else if(ex.type === "mcq") renderMCQ(ex, ui);
  }

  var verdict = el("div", "verdict");
  root.appendChild(verdict);
  VERDICTS.push(verdict);
}

activate(0);
})();
</script>
